# Overrides of the shared PCTO axes (defaults/python_cuda_torch_os_policy.yml)
# for this package only.
# Pilot package for the linux_aarch64 platform (Grace/GB200 cloud, Jetson):
# tiny CUDAExtension, ~6min/job, cheap to iterate on. Inherits the shared
# grid; ARM arch lists come from arch_policy_aarch64 in _arch_policy.yml.
build_matrix:
  platforms: ["linux", "windows", "linux_aarch64"]

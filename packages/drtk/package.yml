name: drtk
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: facebookresearch/DRTK
source_tag: c5a3e523435b4daa37572c0653d6686531c787b2
version: 0.1.0
patch_script: packages/drtk/patches/drtk.py
# setuptools pinned below 81: drtk's setup.py imports pkg_resources,
# which setuptools 81 removed (ModuleNotFoundError at metadata prep on
# every linux cell, 2026-08-23). ~= spelling because extra_deps expands
# unquoted in the install shell line ("<81" would redirect).
extra_deps: numpy setuptools~=80.0

# Compile parallelism. BOTH are mandatory in every package.yml -- there is no
# default to fall back on, by design (see scripts/package_loader.py).
#
#   jobs          how many compiler processes run at once. The actual number,
#                 not a ceiling: exported as MAX_JOBS and
#                 CMAKE_BUILD_PARALLEL_LEVEL. An explicit value also preempts
#                 packages whose setup.py picks its own when the env is unset
#                 -- some choose 10, which on a 4-vCPU runner is -j10.
#   nvcc_threads  nvcc --threads: parallel device compiles WITHIN one TU, one
#                 per gencode target. Appended as a TRAILING --threads so it
#                 beats any setup.py hardcode.
#
# They multiply: peak memory is roughly jobs x nvcc_threads x one cicc. On a
# 16GB runner with CUTLASS-heavy sources that product is what decides whether
# the compile swaps or dies.
jobs: 1
# jobs 1, nvcc_threads 4 (owner call 2026-08-26). `jobs` cannot help this
# package and was measured doing nothing: drtk builds SEVEN separate
# CUDAExtensions, and setuptools builds extensions serially
# (_distutils/command/build_ext.py::_build_extensions_serial). MAX_JOBS only
# parallelises WITHIN one extension's ninja invocation, and each of drtk's has
# 1-2 translation units -- so ninja gets -j3 and two files, seven times over.
# Live evidence from run 32975448792 (Linux, cu13.0):
#   MAX_JOBS=3  CMAKE_BUILD_PARALLEL_LEVEL=3
#   cpu: 25-37% (runq 2-3)      <- ~1 core of 4 busy
#   mem: 2.4/15.6GB used        <- 13GB idle
#   ninja: [1/2] [2/2]          <- two edges per invocation
# nvcc --threads is the knob that fits: it parallelises across GENCODE TARGETS
# inside a single TU, and drtk's cu13.0 row is six archs
# (7.5 8.0 8.6 9.0 10.0 12.0), which is exactly where the wall time goes.
# Memory headroom is ample -- 4 concurrent cicc against 13GB free.
# jobs dropped to 1 rather than left at 3: with the extensions built serially
# anyway, a job count above 1 only matters for the two extensions that hold
# more than one TU, and keeping it at 1 means the whole 16GB budget belongs to
# the four cicc processes rather than being nominally split four more ways.
nvcc_threads: 4

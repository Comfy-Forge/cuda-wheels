name: torchao
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
# PyTorch-native quantization/sparsity kernels.
# Gap this fills: upstream ships NO win_amd64 wheel on ANY channel (PyPI or
# download.pytorch.org/whl/cu*), so all Windows cells are uncovered; cu124 is
# additionally frozen at 0.9.0 upstream.
source_repo: pytorch/ao
source_tag: v0.18.0
version: 0.18.0
clone_recursive: true          # third_party/cutlass
# Upstream passes -t=0 (= one thread per gencode, ~6 on cu128) to nvcc.
# The farm's trailing --threads=1 neutralizes it; cap jobs for CUTLASS.
# max_jobs 1 (was 3): the ARM runner died twice with "runner lost
# communication" (OOM starvation kill) at 3 -- CUTLASS TU peaks exceed the
# 16GB box. At 1 the swap parachute is also legal under the swap gate.
max_jobs: 1

name: torchao
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
# PyTorch-native quantization/sparsity kernels.
# Gap this fills: upstream ships NO win_amd64 wheel on ANY channel (PyPI or
# download.pytorch.org/whl/cu*), so all Windows cells are uncovered; cu124 is
# additionally frozen at 0.9.0 upstream.
source_repo: pytorch/ao
source_tag: v0.18.0
patch_script: packages/torchao/patches/torchao.py
version: 0.18.0
# Kill upstream's +git<sha> version suffix (setup.py appends it when
# VERSION_SUFFIX is unset) -- the farm's renamer then produced the
# pip-invalid double local tag 0.18.0+git...+cu128torch2.11.
pre_build_script: echo "VERSION_SUFFIX=" >> $GITHUB_ENV
clone_recursive: true          # third_party/cutlass
# Upstream passes -t=0 (= one thread per gencode, ~6 on cu128) to nvcc.
# The farm's trailing --threads=1 neutralizes it; cap jobs for CUTLASS.
# max_jobs 1 (was 3): the ARM runner died twice with "runner lost
# communication" (OOM starvation kill) at 3 -- CUTLASS TU peaks exceed the
# 16GB box. At 1 the swap parachute is also legal under the swap gate.
# jobs 1, NOT the farm-wide 3. Restored 2026-08-26 after the uniform policy
# raised it and cu13.0/torch2.11 linux immediately reproduced the failure this
# value exists to prevent: peak swap 7.84GB, MemAvailable low-water 0.18GB.
# The original note, still accurate: the ARM runner died twice with "runner
# lost communication" (an OOM starvation kill) at 3 -- CUTLASS TU peaks exceed
# the 16GB box. At 1 the swap parachute is also legal under the swap gate.
# Upstream passes -t=0 (one thread per gencode, ~6 on cu128) to nvcc; the
# farm's trailing --threads=1 neutralises it, so the whole memory budget goes
# to one CUTLASS translation unit.
jobs: 1
nvcc_threads: 1
verify:
  # _C_cutlass_90a / _C_mxfp8 are torch-ops libraries with no PyInit --
  # loaded via torch.ops.load_library by torchao's facade, never imported
  # directly (same pattern as torch_scatter's *_cuda.so).
  no_direct_import: ["*_C_cutlass*", "*_C_mxfp8*"]
  skip_arch: >-
    arch-specialized package: 0.18's only CUDA kernels are CUTLASS sm90a
    (_C_cutlass_90a) and mxfp8 sm100a (_C_mxfp8, cu12.8+/torch2.11+ cells
    that build it); the main _C is pure C++. There is no generic-arch SASS,
    so the cell arch list is a compile-capability input here, not a content
    expectation -- checking it fails every wheel on "missing sm_8x" that
    upstream never compiles for any arch list (proven 2026-08-23, 11 linux
    cells). Presence of compiled kernels is still enforced by the census.

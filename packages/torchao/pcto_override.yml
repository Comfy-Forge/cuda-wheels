# Overrides of the shared PCTO axes (defaults/python_cuda_torch_os_policy.yml)
# for this package only.
# 0.18.0's facade imports ScalingType from torch.nn.functional, which
# exists only from torch 2.9 -- the 2.8-and-older cells cannot import.
# 2.11: the farm ships torch 2.8 (x86) and 2.11 (ARM); torchao 0.18 can't
# import below 2.9 anyway, and aligning the floor to the shipped ARM torch
# keeps its only live cells honest (owner call 2026-08-22).
min_pytorch: "2.11.0"

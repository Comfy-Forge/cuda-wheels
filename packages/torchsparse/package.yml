name: torchsparse
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
# Sparse convolution for point clouds (MIT HAN Lab).
# Gap this fills: EVERY upstream channel is dead -- pypi.org/simple/torchsparse
# 404s, the README index pypi.hanlab.ai 404s, the install.py fallback index
# 404s, and the v2.0.0/v1.4.0 GH releases carry zero assets. Source build only.
source_repo: mit-han-lab/torchsparse
source_tag: v2.0.0
# The v2.0.0 TAG declares __version__ = "2.0.0b0" -- pin the truth (the
# gate rightly blocked the aspirational 2.0.0; same lesson as dpvo_cuda).
version: 2.0.0b0
# Plain CUDAExtension with no gencode of its own -- it inherits
# TORCH_CUDA_ARCH_LIST, so the shared grid arch lists apply unchanged.
jobs: 3   # five 100-120KB implicit-GEMM TUs; heavy tail
nvcc_threads: 1
extra_deps: tqdm   # setup.py imports it at metadata generation
patch_script: packages/torchsparse/patches/torchsparse.py
# Google sparsehash (header-only) -- hashmap_cpu.hpp includes
# <google/dense_hash_map>. Linux/ARM: EPEL's sparsehash-devel ships the
# properly generated sparseconfig.h into the default include path.
# Windows: the patch vendors the tarball (with upstream's MSVC
# sparseconfig.h) and injects include_dirs. The guard keeps this a
# no-op on Windows' bash (no dnf there).
pre_build_script: |
  if command -v dnf >/dev/null 2>&1; then
    dnf install -y -q epel-release >/dev/null
    dnf install -y -q sparsehash-devel >/dev/null
    echo "sparsehash-devel installed (linux)"
  fi

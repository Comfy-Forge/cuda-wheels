name: flashinfer_jit_cache
# Torch-independent -- see CW-ADR-0011.
# flashinfer/jit/cpp_ext.py forks torch's cpp_extension but its ldflags
# are `-lcudart -lcuda` and nothing else. Caveat: it does read
# torch._C._GLIBCXX_USE_CXX11_ABI into its *compile* flags, so wheels built
# either side of PyTorch's manylinux_2_28 ABI flip are not interchangeable.
links_torch: false
# LLM-serving attention kernels.
# IMPORTANT: flashinfer does NOT link libtorch -- its modules link only
# -lcudart -lcuda and cross the boundary via apache-tvm-ffi/DLPack. There is
# therefore no torch axis; the meaningful matrix is (cuda x python x platform).
# links_torch: false makes generate_matrix collapse the torch axis itself
# (newest torch per CUDA line as the build env) -- see pcto_override.yml,
# which only restricts platforms.
# Gap this fills: modern jit-cache for cu124/cu126 (flashinfer.ai/whl only
# serves cu128/cu129/cu130). Windows turned out to be an upstream porting
# project (see pcto_override.yml) -- not served.
source_repo: flashinfer-ai/flashinfer
source_tag: v0.6.17
version: 0.6.17
clone_recursive: true
build_subdir: flashinfer-jit-cache     # the AOT-compiled kernel cache wheel
max_jobs: 3   # AOT cache: hundreds of medium TUs; 3 fits the 16GB budget
verify:
  expect_device_error: true
  needs_driver: true
# The farm builds --no-build-isolation, so upstream's build-system.requires
# must be mirrored here (tvm-ffi/pynvml for metadata generation; tqdm +
# requests for the AOT compile loop -- wave 2 died on tqdm).
extra_deps: apache-tvm-ffi pynvml tqdm requests
# The AOT compile needs FLASHINFER_CUDA_ARCH_LIST explicitly (no GPU to
# probe on CI). The pre-build step exports the cell's arch list as
# TORCH_CUDA_ARCH_LIST env (GitHub expressions do NOT re-expand inside
# input values -- a ${{ }} written here would stay literal); strip +PTX
# and switch to spaces (compilation_context.py's format; arch suffixes
# are auto-normalized there).
pre_build_script: |
  echo "FLASHINFER_CUDA_ARCH_LIST=$(echo "$TORCH_CUDA_ARCH_LIST" | tr ';' ' ' | sed 's/+PTX//g')" >> $GITHUB_ENV

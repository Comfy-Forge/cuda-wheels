# Overrides of the shared arch policy (defaults/arch_policy.yml)
# for this package only.
#
# ---------------------------------------------------------------------------
# 8.9 (Ada / RTX 40-series) is MANDATORY on EVERY lane, x86 and ARM alike.
#
# setup.py v2.2.0 builds the `_qattn_sm89` extension whenever
# HAS_SM89 || HAS_SM90 || HAS_SM120 -- so on an arch list that carries 9.0 or
# 12.0 but NOT 8.9, the module still lands in the wheel, just without an
# sm_89 cubin. On an Ada device the loader then takes the sm_80 cubin by
# minor-version compatibility, and sageattn() routes it straight there:
# core.py:148 dispatches arch == "sm89" to sageattn_qk_int8_pv_fp8_cuda(),
# i.e. into _qattn_sm89.
#
# What that sm_80 cubin actually contains (NVIDIA disassembly review of the
# shipped ARM wheel, 2026-08-25). This CORRECTS the wording this file used to
# carry -- "those gated paths compile to stubs and cudaErrorLaunchFailure
# surfaces at runtime". Right conclusion, wrong mechanism, and the wrong
# mechanism is what a future reader would act on:
#   * csrc/mma.cuh gates the FP8 tensor-core wrappers on __CUDA_ARCH__ >= 890
#     (MMA_F8F8F32_M16N8K16_ENABLED at mma.cuh:44, MMA_F8F8F16_M16N8K16_ENABLED
#     at mma.cuh:50). With the gate closed the #else branch is
#     RUNTIME_ASSERT(...), which on the device pass expands to __brkpt()
#     (mma.cuh:55-57) -- a real instruction, not a stub.
#   * Everything else in the kernel compiles normally, including the INT8 QK
#     matmul (mma.sync .s32.s8.s8.s32 is enabled from __CUDA_ARCH__ >= 800).
#   * Measured: the sm_80 cubins are FULL SIZE (median 43,968 B, against
#     53,248 B for sm_89) and hold 26,880 BPT.TRAP and ZERO QMMA ops, where
#     the sm_89 cubin holds 23,040 QMMA.16832.F32.E4M3.E4M3.
# So an Ada user gets neither a fallback nor a slow path. The kernel launches,
# completes the QK matmul, and then executes the trap:
# "CUDA error: an illegal instruction was encountered" -- context destroyed,
# process unrecoverable.
#
# 8.6 is KEPT (removing an arch is a narrowing, and this file does not narrow),
# but its original justification was false and is written down here so it is
# not repeated: it claimed 8.6 was added "so Ampere consumer cards get a native
# cubin instead of relying on JIT".
#   * There is no compute_80/compute_86 PTX in any row below -- the +PTX tail
#     sits on the highest arch only -- so there was never a JIT path to
#     relieve. Without 8.6 an sm_86 device would have used the sm_80 cubin.
#   * And the auto-dispatcher never reaches an sm_86 cubin at all: core.py:146
#     routes arch == "sm86" to sageattn_qk_int8_pv_fp16_triton, whose
#     quantization is also Triton (per_block_int8_triton), so an sm86 device
#     going through sageattn() touches NO cubin this package ships.
#     The sm_86 cubins in _qattn_sm80 and _fused are still reachable -- but
#     only through the explicit public entry points sageattn_varlen() and
#     sageattn_qk_int8_pv_fp16_cuda(), which route via quant.py's _fused
#     kernels. (Earlier wording here said "only by calling
#     sageattn_qk_int8_pv_fp16_cuda() by hand"; both are exported from
#     sageattention/__init__.py, so "by hand" undersold it.)
# 8.6 therefore earns its place as an exactness/perf hedge for those explicit
# callers, not as a JIT-avoidance measure.
# ---------------------------------------------------------------------------
arch_list_by_cuda:
  '12.4': 8.0 8.6 8.9 9.0+PTX
  '12.6': 8.0 8.6 8.9 9.0+PTX
  # 7.5 and 10.0 RESTORED 2026-08-26 to match the policy row, and waived in
  # package.yml's verify.allow_missing_archs instead of deleted here. See
  # "WAIVE, DO NOT NARROW" at the bottom of this file. Nothing about the built
  # wheel changes -- setup.py:141-158 hits `else: continue` on both -- but the
  # gate now REPORTS the gap on every build instead of being told not to look.
  '12.8': 7.5 8.0 8.6 8.9 9.0 10.0 12.0+PTX
  '12.9': 7.5 8.0 8.6 8.9 9.0 10.0 12.0+PTX
  '13.0': 7.5 8.0 8.6 8.9 9.0 10.0 12.0+PTX
  '13.2': 7.5 8.0 8.6 8.9 9.0 10.0 12.0+PTX
# NOTE: no 10.0 anywhere -- SageAttention 2.2 ships no sm_100 kernel
# (Blackwell datacenter unsupported; consumer sm_120 via the FP8 path is).
# setup.py's SUPPORTED_ARCHS is exactly {8.0, 8.6, 8.9, 9.0, 12.0} and its
# gencode loop silently `continue`s on anything else.
# The gate proved the built wheels contain 80/86/89/90/120 exactly.
# The kernel gap is platform-independent, so the aarch64 lane needs the
# same 10.0 removal (the gate caught the ARM build missing sm_100 against
# the default aarch64 policy row):
arch_list_by_cuda_aarch64:
  # 8.9 ADDED 2026-08-25 -- a WIDENING, nothing removed. These rows shipped
  # 8.0/9.0/12.0 only, which put five ARM wheels (cu12.8/12.9/13.0/13.2) into
  # exactly the trap described above on any Ada-class device: an L4/L40S or
  # RTX 40-series board in a Grace/Altra host, or a GB10-class dev board.
  # The trap is a property of the CUBIN, not of the host ISA, so the ARM lane
  # was never exempt -- the x86 rows have carried 8.9 from the start.
  # nvcc >= 12.4 is required for 8.9 (setup.py raises below that); every ARM
  # row here is 12.8+, so the floor is satisfied on all four.
  '12.8': 8.0 8.9 9.0 10.0 12.0+PTX
  # Same kernel gap on every newer ARM line: the default aarch64 policy rows
  # carry 10.0 (and 11.0 on 13.x), which SageAttention 2.2 cannot emit, so the
  # arch_sass gate rejected all 67 cu12.9/13.0/13.2 ARM wheels ("missing arch
  # families sm_[10]"). cuobjdump proves the built wheels contain 80/90/120
  # only, so this drops NO real coverage -- it aligns the expectation with
  # what the source can produce (2026-08-24).
  '12.9': 8.0 8.9 9.0 10.0 12.0+PTX
  # 11.0 (Thor) carried too on the 13.x rows: same waive-don't-narrow rule.
  '13.0': 8.0 8.9 9.0 10.0 11.0 12.0+PTX
  '13.2': 8.0 8.9 9.0 10.0 11.0 12.0+PTX
# 8.6 is deliberately NOT mirrored onto the ARM rows: no Ampere consumer part
# exists on SBSA, and sageattn() routes sm86 to Triton regardless (core.py:146).


# ---------------------------------------------------------------------------
# WAIVE, DO NOT NARROW
#
# These rows used to DELETE 7.5, 10.0 and 11.0 because SageAttention 2.2
# cannot build them. That is a true statement badly encoded, and the bad
# encoding is the farm's most expensive mistake class:
#
#   verify_wheel's C7 compares the wheel against the RESOLVED arch list. Delete
#   an arch from this file and BOTH SIDES of that comparison move. The check
#   goes green, no warning is emitted, and the only record that a GPU is
#   unsupported is a YAML comment. That is indistinguishable from a wheel that
#   genuinely covers everything.
#
# Encoded as verify.allow_missing_archs in package.yml instead, C7 emits
#   "waived (documented upstream gap): ['sm_75', 'sm_100']"
# as a warning on every single build, and the day upstream adds a kernel the
# waiver is the one line to delete.
#
# What upstream actually supports (setup.py:46 and the loop at :141-158):
#   SUPPORTED_ARCHS = {"8.0", "8.6", "8.9", "9.0", "12.0"}
#   anything else hits `else: continue` -- silently skipped, no error, which
#   is why carrying these archs in the list is free.
# The runtime agrees: core.py:144-155 dispatches sm80/86/89/90/120 and raises
#   ValueError(f"Unsupported CUDA architecture: {arch}")
# otherwise. So a B200 (sm_100) user gets a clean Python error from upstream's
# own dispatcher -- NOT cudaErrorNoKernelImageForDevice, which an earlier audit
# reported. The gap is real; the failure mode was described wrongly.
#
# STILL OPEN, deliberately not fixed here: on the cu12.4/12.6 rows the highest
# arch is 9.0, and setup.py compiles 9.0 as `90a` (an ARCH-CONDITIONAL target),
# so `9.0+PTX` yields `compute_90a` PTX -- which loads ONLY on sm_90 and is not
# a forward-compat tail at all. C7 cannot see this: cuobjdump reports `sm_90a`
# and the check folds the suffix before comparing, so dead PTX satisfies it.
# The `no_ptx` flag would suppress it but is package-wide, and it would also
# kill the GENUINE compute_120 PTX on the cu12.8+ rows. Needs a per-CUDA
# opt-out, or upstream dropping the `a`. Those cells are not currently built.

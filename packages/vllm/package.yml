name: vllm
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
# High-throughput LLM serving; PagedAttention + CUTLASS kernels.
# Gap this fills: PyPI ships one wheel per release, cu129 only, and NEVER
# win_amd64.
# NOTE: vLLM hard-pins exactly ONE torch per release (0.27.1 -> torch 2.13),
# so a wide torch fan-out is meaningless here -- upstream metadata would refuse
# to co-install the result. The matrix below is deliberately narrow and tracks
# the torch this tag actually supports.
source_repo: vllm-project/vllm
source_tag: v0.27.1
version: 0.27.1
# Mirrors upstream's [build-system].requires (farm builds
# --no-build-isolation): first-ever attempt died on setuptools_rust at
# metadata generation. torch is deliberately NOT mirrored (upstream pins
# torch==2.13.0 there; the farm builds against the cell's torch).
extra_deps: cmake ninja packaging setuptools-scm setuptools-rust jinja2
# Build against THIS cell's torch instead of upstream's hard pin, and keep
# the wheel's own version clean (triage 2026-08-24):
#  * use_existing_torch.py is vLLM's own script for exactly this; --prefix
#    strips torch=/torchvision=/torchaudio= from requirements/** and
#    pyproject.toml and nothing else. Without it every wheel ships
#    install_requires torch==2.13.0 and refuses to co-install with the torch
#    it was compiled against.
#  * VLLM_VERSION_OVERRIDE short-circuits setup.py's "+cu129" local-version
#    suffix (appended whenever nvcc != VLLM_MAIN_CUDA_VERSION, which is
#    13.0), which otherwise makes the farm renamer skip the wheel and the
#    filename gate reject it. Same class as torchao's VERSION_SUFFIX fix.
pre_build_script: |
  python use_existing_torch.py --prefix || python use_existing_torch.py
  echo "VLLM_VERSION_OVERRIDE=0.27.1" >> $GITHUB_ENV
# vllm is the one package with the jobs/threads tradeoff wired upstream
# (MAX_JOBS -> job pool AND cmake --build -j; NVCC_THREADS -> --threads).
# max_jobs 1 (was 3): three concurrent cicc on the CUTLASS SM100 blockscaled
# TUs peaked at 14.3GB on a 16GB runner and the job was OOM-killed (exit 137)
# at [109/476].
max_jobs: 1
# 476 TUs at max_jobs=1 would blow through the 6h job ceiling, so split the
# compile across shards via the generic nvcc-seat wrapper (same mechanism
# spconv and llama_cpp_python use for their cmake builds -- it partitions
# below cmake by md5(src) % shard_count, no per-package code).
sharding: 20
sharding_platforms: ["linux"]
verify:
  expect_device_error: true

# Overrides of the shared PCTO axes (defaults/python_cuda_torch_os_policy.yml)
# for this package only.
build_matrix:
  combinations:
    # No cu12.8: vllm 0.27.1's csrc uses cuda::ptx mbarrier/cp_async_bulk
    # overloads that exist only in the CUDA >= 12.9 libcudacxx -- the
    # cu12.8 compile fails in cooperative_topk.cuh (proven 2026-08-22).
    - {cuda: "12.9", pytorch: "2.11.0", python_versions: ["3.10","3.11","3.12","3.13","3.14"]}
    - {cuda: "13.0", pytorch: "2.11.0", python_versions: ["3.10","3.11","3.12","3.13","3.14"]}
  # vLLM has no Windows support upstream -- no win32 branch anywhere in setup.py.
  platforms: ["linux"]

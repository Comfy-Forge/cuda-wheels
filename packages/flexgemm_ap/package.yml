name: flex_gemm_ap
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: PozzettiAndrea/FlexGEMM-ap
source_tag: 3432bc7ce157b0f668ecf0d856d69353816f5c47
patch_script: packages/flexgemm_ap/patches/flexgemm_ap.py
extra_deps: numpy
extra_cuda_components: cufft_dev nvtx
clone_recursive: true
verify:
  expect_device_error: true  # __init__ probes the GPU at import; device errors expected on CI

# Compile parallelism. BOTH are mandatory in every package.yml -- there is no
# default to fall back on, by design (see scripts/package_loader.py).
#
#   jobs          how many compiler processes run at once. The actual number,
#                 not a ceiling: exported as MAX_JOBS and
#                 CMAKE_BUILD_PARALLEL_LEVEL. An explicit value also preempts
#                 packages whose setup.py picks its own when the env is unset
#                 -- some choose 10, which on a 4-vCPU runner is -j10.
#   nvcc_threads  nvcc --threads: parallel device compiles WITHIN one TU, one
#                 per gencode target. Appended as a TRAILING --threads so it
#                 beats any setup.py hardcode.
#
# They multiply: peak memory is roughly jobs x nvcc_threads x one cicc. On a
# 16GB runner with CUTLASS-heavy sources that product is what decides whether
# the compile swaps or dies.
jobs: 3
nvcc_threads: 1

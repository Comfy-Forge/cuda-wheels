name: o_voxel
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: microsoft/TRELLIS.2
source_tag: 5565d240c4a494caaf9ece7a554542b76ffa36d3
build_subdir: o-voxel
patch_script: packages/ovoxel/patches/ovoxel.py
clone_recursive: false  # only submodule is gitlab eigen -> tarball in patch (403 flake)
# Curated Requires-Dist (CW-ADR-0004): upstream declares cumesh/flex_gemm
# as git URLs (unusable from an index); our patch made them bare names,
# which pip would resolve against PyPI, not the farm. Exact+local sibling
# pins resolve from our index or fail loudly (PyPI forbids local versions).
requires_dist:
  - torch
  - numpy
  - plyfile
  - trimesh
  - tqdm
  - zstandard
  - easydict
  - "cumesh=={VER:cumesh}+{LOCAL}"
  - "flex_gemm=={VER:flexgemm}+{LOCAL}"

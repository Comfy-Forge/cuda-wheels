name: llama_cpp_python
# Torch-independent -- see CW-ADR-0011.
# scikit-build-core over GGML's CMake. No torch in the build or the link.
links_torch: false
# Python bindings to llama.cpp (GGUF inference).
# IMPORTANT: this is a GGML/cuBLAS build, NOT a PyTorch extension -- it does
# not link libtorch, so it has no torch axis; the produced binary is
# identical across torch versions. links_torch: false makes generate_matrix
# collapse the torch axis itself (newest torch per CUDA line as the build
# env) -- see pcto_override.yml, which only restricts platforms.
# Gap this fills: PyPI has ZERO wheels across all 208 releases, and abetlen's
# own CUDA index 404s on cu126/cu128/cu129.
source_repo: abetlen/llama-cpp-python
source_tag: v0.3.35
version: 0.3.35
clone_recursive: true          # vendors ggml-org/llama.cpp
# CUDA is OFF by default in llama.cpp's CMake. There is no `env:` field in this
# schema, and pre_build_script runs in its own shell step, so the variable is
# exported to later steps via $GITHUB_ENV rather than a plain export.
pre_build_script: echo "CMAKE_ARGS=-DGGML_CUDA=on" >> $GITHUB_ENV
extra_deps: scikit-build-core cmake ninja
sequential_checkpoint: 10800   # 3h links; 187 .cu + 86 .cuh (~55k LOC), hours total
# GGML's CMake build never sees ninja -j from MAX_JOBS; the build action
# mirrors max_jobs into CMAKE_BUILD_PARALLEL_LEVEL, which it does obey.
max_jobs: 4
verify:
  import_name: llama_cpp
  # bare shared libs (libllama.so, libggml*.so) are dlopen targets of the
  # python binding, never importable modules
  no_direct_import: ["*/lib/*.so*", "*libllama*", "*libggml*"]

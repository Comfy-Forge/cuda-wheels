name: llama_cpp_python
# Torch-independent -- see CW-ADR-0011.
# scikit-build-core over GGML's CMake. No torch in the build or the link.
links_torch: false
# Python bindings to llama.cpp (GGUF inference).
# IMPORTANT: this is a GGML/cuBLAS build, NOT a PyTorch extension -- it does
# not link libtorch, so it has no torch axis; the produced binary is
# identical across torch versions. links_torch: false makes generate_matrix
# collapse the torch axis itself (newest torch per CUDA line as the build
# env) -- see pcto_override.yml, which only restricts platforms.
# Gap this fills: PyPI has ZERO wheels across all 208 releases, and abetlen's
# own CUDA index 404s on cu126/cu128/cu129.
source_repo: abetlen/llama-cpp-python
source_tag: v0.3.35
version: 0.3.35
clone_recursive: true          # vendors ggml-org/llama.cpp
# CUDA is OFF by default in llama.cpp's CMake. There is no `env:` field in this
# schema, and pre_build_script runs in its own shell step, so the variable is
# exported to later steps via $GITHUB_ENV rather than a plain export.
# CMAKE_GENERATOR=Ninja: on Windows, scikit-build-core keeps CMake's
# default Visual Studio generator, whose enable_language(CUDA) demands
# NVIDIA's VS-integration MSBuild files ("No CUDA toolset found") that
# the network installer does not ship. Ninja invokes nvcc directly.
# Harmless on Linux (already Ninja).
# CUDAARCHS: GGML's cmake never sees TORCH_CUDA_ARCH_LIST; without it,
# cmake's ancient default produced an sm_52-only libggml-cuda (gate
# caught it). CUDAARCHS is cmake >= 3.20's env for
# CMAKE_CUDA_ARCHITECTURES: semicolon-separated bare numbers (each emits
# SASS + PTX). Derived from the cell's arch list, which the pre-build
# step exports as TORCH_CUDA_ARCH_LIST.
pre_build_script: |
  echo "CMAKE_ARGS=-DGGML_CUDA=on" >> $GITHUB_ENV
  echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
  # <N>-real per arch, plus <N>-virtual ONLY where the policy asked for +PTX.
  # A BARE number makes cmake emit code=[compute_N,sm_N] -- PTX *and* SASS for
  # every arch -- which pushed the cu12.4/12.6 wheels (7 archs = 14 code
  # images) to 2.41GB, over GitHub's 2GiB release-asset limit (HTTP 422,
  # 2026-08-24). Keeps every SASS target and the one PTX image actually
  # requested, i.e. matches the arch policy instead of exceeding it.
  echo "CUDAARCHS=$(python3 -c "import os; a=os.environ['TORCH_CUDA_ARCH_LIST'].replace(';',' ').split(); print(';'.join([x for p in a for x in ([p.replace('+PTX','').replace('.','')+'-real'] + ([p.replace('+PTX','').replace('.','')+'-virtual'] if p.endswith('+PTX') else []))]))")" >> $GITHUB_ENV
extra_deps: scikit-build-core cmake ninja
patch_script: packages/llama_cpp_python/patches/llama_cpp_python.py
# GGML's CMake build never sees ninja -j from MAX_JOBS; the build action
# mirrors max_jobs into CMAKE_BUILD_PARALLEL_LEVEL, which it does obey.
max_jobs: 4
# Sharding (owner order 2026-08-22): seat-wrapper lanes only. The wrapper's
# probe deny-list keeps cmake's compiler-id/try_compile TUs compiling for
# real; GGML links without RDC, so stubbed foreign .cu objects pass the
# shard-stage .so link. Windows stays unsharded (CUDAExtension filter is
# blind to cmake builds).
sharding: 10
sharding_platforms: ["linux", "linux_aarch64"]
verify:
  import_name: llama_cpp
  # bare shared libs (libllama.so, libggml*.so) are dlopen targets of the
  # python binding, never importable modules
  no_direct_import: ["*/lib/*.so*", "*libllama*", "*libggml*"]
  # cuBLAS stays external (CW-ADR-0009 justification): vendoring grafts
  # ~850MB; in the comfy-env/ComfyUI context torch preloads
  # libcublas/libcublasLt before llama loads, so DT_NEEDED resolves by
  # SONAME. Standalone users need the CUDA toolkit on the loader path.
  allowed_needed: ["libcublas.so*", "libcublasLt.so*"]

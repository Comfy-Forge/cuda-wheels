# Overrides of the shared arch policy (defaults/arch_policy.yml)
# for this package only.
# cumm 0.7.11's arch table ends at 9.0 (plus 8.7): Blackwell (10.0/12.0)
# and Thor (11.0) tokens crash setup with "Unknown CUDA arch". Inert for
# wheel content (runtime NVRTC JIT, no AOT SASS; verify.skip_arch) --
# the list only needs to parse. Trimmed on every lane.
arch_list: "7.5;8.0;8.6;8.9;9.0+PTX"
arch_list_aarch64: "8.0;8.7;9.0+PTX"

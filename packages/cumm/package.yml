name: cumm
# Torch-independent -- see CW-ADR-0011.
# pccm/PCCMExtension build; setup.py deps are [pccm]. No torch at
# build, compile or link time.
links_torch: false
source_repo: FindDefinition/cumm
source_tag: v0.7.11
# 0.7.11 (was 0.8.2, reverted 2026-08-22): spconv 2.3.8's harness
# cannot compile 0.8.x GEMM sources (std::numeric_limits block
# breakage in tf32.h/float8.h under its TU order), upstream pins
# cumm<0.8, and the farm's bf16 patch anchors are IDENTICAL in both
# tags -- 0.8.2 bought nothing. One cumm for build, gate and runtime.
version: 0.7.11   # also read by sibling {VER:cumm} pins (spconv)
clone_recursive: true
# Curated Requires-Dist (CW-ADR-0004): upstream leaks its build stack
# (pccm/pybind11) and its CLI helper (fire) as runtime deps.
patch_script: packages/cumm/patches/cumm.py
extra_deps: pccm>=0.4.16 ccimport>=0.4.4
verify:
  # PER-PLATFORM waiver (scoped 2026-08-25). This used to be a single string,
  # which is a claim about every lane the farm builds -- and the claim it made
  # was "the vendored NVRTC (99MB libnvrtc in the wheel)", which is true only
  # on Linux. The Windows wheel bundles NOTHING (verified: one .pyd, zero
  # DLLs, 1.3MB for cp312/cu130/torch2.13). So a Linux-only premise was
  # switching the arch gate off farm-wide. verify_wheel.platform_knob() now
  # resolves this per platform; a lane with no entry here is NOT waived.
  skip_arch:
    linux: >-
      runtime-JIT package: kernels are compiled at import/run time via the
      vendored NVRTC (cumm.libs/libnvrtc.so.13 ~109MB plus
      libnvrtc-builtins.so.13 ~6MB, grafted by auditwheel); no AOT SASS is
      baked despite CUMM_DISABLE_JIT=1 -- true of every wheel the farm has
      ever shipped (verified against legacy releases). See README.
    linux_aarch64: >-
      same as linux: auditwheel on the ARM runner vendors libnvrtc +
      libnvrtc-builtins into cumm.libs/, and no AOT SASS is baked. Written
      out separately rather than inherited so the ARM claim is one someone
      actually checked.
    windows: >-
      no AOT SASS on this lane either -- cuobjdump reports "does not contain
      device code" for cumm/core_cc.cp*-win_amd64.pyd, and that is by design
      (the GEMM/conv kernels are generated and NVRTC-compiled at run time),
      so there is no arch content for the gate to measure. This waiver covers
      arch content ONLY. It does NOT excuse the separate, real defect on this
      lane: unlike Linux the Windows wheel vendors no DLL at all, while
      core_cc carries a LOAD-TIME (not delay-loaded) PE import of
      nvrtc64_130_0.dll -- verified with `objdump -p`, whose Delay Import
      Directory is empty. Without a matching CUDA Toolkit on PATH the import
      dies with "DLL load failed while importing core_cc", and spconv's
      Windows wheel inherits it (its __init__ loads cumm first). That defect
      needs DLL vendoring (delvewheel), not an arch waiver.

# Compile parallelism. BOTH are mandatory in every package.yml -- there is no
# default to fall back on, by design (see scripts/package_loader.py).
#
#   jobs          how many compiler processes run at once. The actual number,
#                 not a ceiling: exported as MAX_JOBS and
#                 CMAKE_BUILD_PARALLEL_LEVEL. An explicit value also preempts
#                 packages whose setup.py picks its own when the env is unset
#                 -- some choose 10, which on a 4-vCPU runner is -j10.
#   nvcc_threads  nvcc --threads: parallel device compiles WITHIN one TU, one
#                 per gencode target. Appended as a TRAILING --threads so it
#                 beats any setup.py hardcode.
#
# They multiply: peak memory is roughly jobs x nvcc_threads x one cicc. On a
# 16GB runner with CUTLASS-heavy sources that product is what decides whether
# the compile swaps or dies.
jobs: 3
nvcc_threads: 1

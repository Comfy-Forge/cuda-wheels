name: cumm
# Torch-independent -- see CW-ADR-0011.
# pccm/PCCMExtension build; setup.py deps are [pccm]. No torch at
# build, compile or link time.
links_torch: false
source_repo: FindDefinition/cumm
source_tag: v0.8.2
version: 0.8.2   # also read by sibling {VER:cumm} pins (spconv)
clone_recursive: true
# Curated Requires-Dist (CW-ADR-0004): upstream leaks its build stack
# (pccm/pybind11) and its CLI helper (fire) as runtime deps.
requires_dist:
  - numpy
  - sympy
patch_script: packages/cumm/patches/cumm.py
extra_deps: pccm>=0.4.16 ccimport>=0.4.4
verify:
  skip_arch: >-
    runtime-JIT package: kernels are compiled at import/run time via the
    vendored NVRTC (99MB libnvrtc in the wheel); no AOT SASS is baked despite
    CUMM_DISABLE_JIT=1 -- true of every wheel the farm has ever shipped
    (verified against legacy releases). See README.

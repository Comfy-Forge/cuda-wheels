name: flash_attn
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: Dao-AILab/flash-attention
source_tag: v2.8.3
version: 2.8.3
patch_script: packages/flash_attn/patches/flash_attn.py
extra_deps: psutil
nvcc_flags: -diag-suppress=221
# max_jobs 1 (was 2): at sharding 20 a shard holds ~4 TUs, so in-job
# parallelism buys nothing while two simultaneous ~6-7GB cicc peaks
# tripped the swap gate on ARM (1.28GB swapped). Serial slice ~30min.
# Explicit max_jobs bypasses upstream's free-RAM estimator, which under
# the farm's 4-arch list computes 18GB/job and lands on jobs=1 (serial).
# With nvcc_threads=1 the real per-job peak is ~one cicc, so 2 fits.
# nvcc_threads 2, NOT 3 (owner call 2026-08-26 after cu13.0/torch2.11 linux
# failed at 3). Sharded, so jobs stays 1: a shard holds ~2 TUs and process-level
# parallelism buys nothing, while --threads runs one cicc per gencode target
# INSIDE a single TU. On this package's 4-5 arch rows that is where the memory
# goes, and 3 is over the 16GB box.
jobs: 1
# nvcc_threads 1 (owner call 2026-08-26). Tried 3, then 2; both trip the swap
# gate. At 3, 5 of 40 shards failed (peak swap 5.46GB, MemAvailable low-water
# 0.99GB). At 2, an ARM shard still failed with peak swap 1.55GB and
# MemAvailable 1.77GB -- scraping BOTH gate thresholds (>1.0GB swap AND
# <2.0GB available), not comfortably under them.
#
# Deliberately NOT tuned per platform off that one sample. Only one shard of
# one ARM cell failed on this run, but the margin is thin on every lane, and a
# pass on cu13.0/py3.12 today says nothing about cu13.2/py3.10/Windows
# tomorrow. flash_attn compiles ~72 CUTLASS TUs against a 4-5 arch row; one
# cicc is simply most of what a 16GB runner has.
#
# Wall clock is bought with SHARD COUNT here instead -- shards are memory-
# neutral (each still runs 1 job x 1 thread), so raising `sharding` shortens
# the critical path without touching peak memory. That is the lever to reach
# for if this gets too slow.
nvcc_threads: 1
sharding: 25  # owner call 2026-08-26 -- down from 40
# 40 was raised on the reasoning below (same runner-hours, half the critical
# path) and that part held. What changed is the memory budget: with
# nvcc_threads at 2 a shard now runs two cicc processes inside one TU, and at
# 40 the slice was thin enough that the extra job overhead bought little
# against that cost. 25 keeps ~3 TUs per shard and cuts the artifact
# round-trip, measured at ~0.55s of link-job time per shard.
# Was 20 (owner order 2026-08-22). Raised now that the Windows link path
# actually works: the link job went from >108min (never completing --
# the compile no-op was shadowed and it recompiled all 73 TUs serially)
# to 79 SECONDS. With the link no longer the bottleneck, more shards is
# a straight wall-clock win: same total runner-hours, half the critical
# path. Measured per-shard artifact cost is ~0.55s of link-job time, so
# the round-trip does not become binding at this scale.

name: spconv
# Torch-independent -- see CW-ADR-0011.
# pccm/PCCMExtension build; setup.py deps are [cumm]. Torch is imported
# by spconv's Python layer only -- core_cc*.so carries no DT_NEEDED on libtorch.
links_torch: false
source_repo: traveller59/spconv
source_tag: v2.3.8
patch_script: packages/spconv/patches/spconv.py
# cumm PINNED to upstream spconv-2.3.8's own spec: with cumm 0.8.2 in the
# build env, pccm 0.4.16's extract_module_id_of_class crashes resolving
# cumm's classes (site-packages path not under any registered root) --
# cumm 0.8.x reorganized its codegen layout past what spconv 2.3.8's
# pccm walk understands. OPEN: the farm ships cumm 0.8.2 wheels; whether
# spconv-2.3.8-at-runtime tolerates 0.8.2 (import gate tests 0.7.x, the
# build env's version) is unproven -- revisit the curated sibling pin
# once the build is green.
extra_deps: pccm>=0.4.16 ccimport>=0.4.4
# cumm arrives in pre_build, not extra_deps: x86/win take the PyPI wheel;
# aarch64 has NO cumm 0.7.x wheels OR sdist upstream, so it builds from
# the git tag (JIT-mode cumm: pccm codegen + tensorview core, no AOT
# kernels). Runs after the patch step, so the ccimport symlink fix is
# already in place for cumm's own pccm build. CUDA version detection is
# left to cumm (torch + CUDA_HOME are both present).
pre_build_script: |
  if [ "$(uname -m)" = "aarch64" ]; then
    echo "aarch64: building cumm 0.7.11 from source (upstream ships no ARM wheels)"
    # EDITABLE install on purpose: a plain git+ install builds the native
    # core fine but does not package cumm's bundled include/ tree, and the
    # installed package then fails its own TENSORVIEW_INCLUDE_PATH assert.
    # Editable keeps the source layout where include/ exists.
    git clone --depth 1 --branch v0.7.11 https://github.com/FindDefinition/cumm.git "$RUNNER_TEMP/cumm-src"
    python -m pip install --no-build-isolation -e "$RUNNER_TEMP/cumm-src"
  else
    python -m pip install "cumm<0.8.0,>=0.7.11"
  fi
# Curated Requires-Dist (CW-ADR-0004): upstream leaks its build stack
# (pccm/ccimport/pybind11/fire) as runtime deps and pins cumm<0.8.0,
# which our own farm cumm (0.8.2) does not even satisfy. The sibling pin
# is exact+local so it resolves from our index or fails loudly.
requires_dist:
  - numpy
  - "cumm=={VER:cumm}+{LOCAL}"
verify:
  extra_imports: [spconv.pytorch]
  # core_cc is loaded by spconv's own __init__ (which registers cumm's
  # tv::Tensor types first); a second DIRECT import re-runs the pybind
  # registrations ("ExternalAllocator ... already defined") and poisons
  # the sibling phases. The facade imports are the assert.
  no_direct_import: ["*core_cc*"]
  skip_arch: >-
    runtime-JIT package: kernels are compiled at import/run time via the
    vendored NVRTC (99MB libnvrtc in the wheel); no AOT SASS is baked despite
    CUMM_DISABLE_JIT=1 -- true of every wheel the farm has ever shipped
    (verified against legacy releases). See README.
# Sharding (owner order 2026-08-22): linux only, via the nvcc-seat
# wrapper. Windows stays unsharded (the CUDAExtension filter never fires
# for a pccm build -- proven 2026-08-21: 6 shards each compiled the full
# source); ARM stays unsharded (its pre_build rebuilds cumm from source,
# which every shard would repeat). If pccm invokes nvcc by absolute path
# the seat misses and the link job's hit-rate assert reds out -- that is
# the experiment's tripwire.
sharding: 10
sharding_platforms: ["linux"]

name: spconv
# Torch-independent -- see CW-ADR-0011.
# pccm/PCCMExtension build; setup.py deps are [cumm]. Torch is imported
# by spconv's Python layer only -- core_cc*.so carries no DT_NEEDED on libtorch.
links_torch: false
source_repo: traveller59/spconv
source_tag: v2.3.8
patch_script: packages/spconv/patches/spconv.py
extra_deps: pccm>=0.4.16 ccimport>=0.4.4
# cumm comes from THE FARM'S OWN RELEASE on every platform (owner call
# 2026-08-22): the 0.8.2 wheels the farm builds are the same artifact the
# curated sibling pin (cumm=={VER:cumm}+{LOCAL}) points users at, so
# build and runtime finally pair identically. The old upstream cumm<0.8
# pin was blamed for the pccm crash, but the real cause was the ccimport
# symlink bug (fixed in the patch) -- 0.8.2 is expected to work and the
# gate judges. Asset selection matches this cell's cuda/python/platform
# from the release listing (the torch tag varies per CUDA line, so it is
# matched loosely).
pre_build_script: |
  cat > /tmp/pick_cumm.py <<'PY'
  import json, os, platform, sys, urllib.request
  cu = os.environ["CUW_CUDA_VERSION"].replace(".", "")
  py = f"cp{sys.version_info.major}{sys.version_info.minor}"
  mach = platform.machine().lower()
  plat = "win_amd64" if os.name == "nt" else ("aarch64" if "aarch64" in mach or "arm64" in mach else "x86_64")
  rel = json.load(urllib.request.urlopen(
      "https://api.github.com/repos/Comfy-Forge/cuda-wheels/releases/tags/cumm-latest"))
  print(next(a["browser_download_url"] for a in rel["assets"]
             if f"+cu{cu}torch" in a["name"] and py in a["name"] and plat in a["name"]))
  PY
  sed -i 's/^  //' /tmp/pick_cumm.py
  CUMM_URL=$(python /tmp/pick_cumm.py)
  echo "farm cumm: $CUMM_URL"
  python -m pip install "$CUMM_URL"
  # Farm wheels exclude libcudart by policy (torch preloads it), but
  # spconv's setup imports cumm WITHOUT torch -- put the toolkit libs on
  # the loader path for the whole job (harmless no-op on Windows, where
  # the CUDA bin dir is already on PATH).
  if [ -d "$CUDA_HOME/lib64" ]; then
    echo "LD_LIBRARY_PATH=$CUDA_HOME/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
    export LD_LIBRARY_PATH="$CUDA_HOME/lib64:$LD_LIBRARY_PATH"
  fi
  python -c "import cumm.tensorview, cumm.constants; print('cumm OK:', cumm.constants.TENSORVIEW_INCLUDE_PATH)"
  # cumm 0.8.2's float8.h specializes std::numeric_limits but includes
  # only <cmath>/<cstdint>; in cumm's own build another header supplies
  # <limits> first, in spconv's TU order nothing does ("numeric_limits
  # is not a template", all 10 shards). Graft the missing include.
  python -c "import importlib.util, pathlib; p = pathlib.Path(importlib.util.find_spec('cumm').submodule_search_locations[0]) / 'include/tensorview/gemm/dtypes/float8.h'; s = p.read_text(); ('#include <limits>' in s) or p.write_text(s.replace('#include <cstdint>', '#include <cstdint>\n#include <limits>', 1)); print('cumm float8.h <limits> ensured')"
# Curated Requires-Dist (CW-ADR-0004): upstream leaks its build stack
# (pccm/ccimport/pybind11/fire) as runtime deps and pins cumm<0.8.0,
# which our own farm cumm (0.8.2) does not even satisfy. The sibling pin
# is exact+local so it resolves from our index or fails loudly -- and
# since the build now uses the same farm wheel, the pairing is proven by
# the gate on every build.
requires_dist:
  - numpy
  - "cumm=={VER:cumm}+{LOCAL}"
verify:
  extra_imports: [spconv.pytorch]
  # core_cc is loaded by spconv's own __init__ (which registers cumm's
  # tv::Tensor types first); a second DIRECT import re-runs the pybind
  # registrations ("ExternalAllocator ... already defined") and poisons
  # the sibling phases. The facade imports are the assert.
  no_direct_import: ["*core_cc*"]
  skip_arch: >-
    runtime-JIT package: kernels are compiled at import/run time via the
    vendored NVRTC (99MB libnvrtc in the wheel); no AOT SASS is baked despite
    CUMM_DISABLE_JIT=1 -- true of every wheel the farm has ever shipped
    (verified against legacy releases). See README.
# Sharding via the nvcc-seat wrapper on the lanes it covers. Windows
# stays unsharded (the CUDAExtension filter never fires for a pccm
# build -- proven 2026-08-21: 6 shards each compiled the full source).
# ARM joins now that its cumm comes as a wheel (the old from-source
# chain would have been repeated by every shard). If pccm invokes nvcc
# by absolute path the seat misses and the link job's hit-rate assert
# reds out -- that is the tripwire.
sharding: 10
sharding_platforms: ["linux", "linux_aarch64"]

# Overrides of the shared PCTO axes (defaults/python_cuda_torch_os_policy.yml)
# for this package only.
# aarch64 is EXPERIMENTAL (owner call 2026-08-22): the required cumm<0.8.0
# has no ARM wheels or sdist upstream, so the pre_build_script builds cumm
# 0.7.11 from its git tag first. Upstream never shipped ARM spconv; if the
# cumm source build proves unviable on aarch64, drop the platform again.
build_matrix:
  platforms: ["linux", "windows", "linux_aarch64"]

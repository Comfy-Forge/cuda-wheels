# Overrides of the shared arch policy (defaults/arch_policy.yml)
# for this package only.
#
# CORRECTED 2026-08-24. This file previously trimmed the arch list to
# "7.5;8.0;8.6;8.9;9.0+PTX" / "8.0;9.0+PTX" on the grounds that cumm 0.7.11
# rejects Blackwell tokens and that "spconv bakes no AOT SASS at all ...
# trimming changes nothing about the shipped wheel". Both halves were wrong:
# cuobjdump finds 478 sm_80 + 478 sm_90 real cubins per wheel, and the
# legacy farm -- which built against cumm 0.8.2 -- shipped sm_100 and sm_120
# as well. So the trim was a silent Blackwell coverage regression, not a
# no-op.
#
# The parse limitation was real but is now fixed at the source:
# packages/cumm/patches/cumm.py restores '10.0'/'11.0'/'12.0' to cumm's
# supported_arches (exactly what 0.8.2 carries), so the 0.7.11 pin -- which
# exists because 0.8.2's GEMM headers are uncompilable by spconv's harness --
# no longer costs coverage.
#
# ORDERING: spconv installs the farm's own cumm WHEEL at build time (see the
# release-asset picker in pre_build.sh), so cumm must be rebuilt and
# republished with the patched table BEFORE spconv can use these rows.
# Until then a spconv build fails loudly with "Unknown CUDA arch (10.0)",
# which is the correct failure -- never re-trim this file to make it green.
# NOTE 2026-08-26: 8.9 (Ada / RTX 40-series) was accidentally dropped from
# the x86 rows when Blackwell was restored on 2026-08-24. Put back -- the
# pre-restore list was "7.5;8.0;8.6;8.9;9.0+PTX" and nothing justified
# removing Ada.
arch_list_by_cuda:
  "12.4": "7.5;8.0;8.6;8.9;9.0+PTX"
  "12.6": "7.5;8.0;8.6;8.9;9.0+PTX"
  "12.8": "7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"
  "12.9": "7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"
  "13.0": "7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"
  "13.2": "7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"
arch_list_by_cuda_aarch64:
  "12.6": "8.0;9.0+PTX"
  "12.8": "8.0;9.0;10.0;12.0+PTX"
  "12.9": "8.0;9.0;10.0;12.0+PTX"
  "13.0": "8.0;9.0;10.0;11.0;12.0+PTX"
  "13.2": "8.0;9.0;10.0;11.0;12.0+PTX"

# NOTE on `[arch_sass] extra archs ['sm_75']` (ARM cu13.0, 2026-08-26).
# Benign, investigated, no action. spconv compiles nothing for Turing: the
# build log's own gencode flags are exactly 478 each of
#   compute_80,code=sm_80   compute_90,code=sm_90   compute_100,code=sm_100
#   compute_110,code=sm_110 compute_120,code=[sm_120,compute_120]
# i.e. the resolved ARM list and nothing else. The sm_75 image comes from
# NVIDIA's own CUDA device runtime, which the prebuilt cumm wheel bundles and
# spconv links:
#   cumm/lib/libcudadevrt.a -> sm_75 sm_80 sm_86 sm_89 sm_90 sm_100 sm_103
#                              sm_110 sm_120 sm_121
# C7 scans the whole extension, so linked-in vendor code shows up alongside the
# package's own. "extra" is a warning and not a failure precisely because the
# farm cannot enumerate what a toolkit archive contributes. Do NOT "fix" this
# by adding 7.5 to the arch list -- that would make the expectation match the
# artifact while telling every reader that spconv ships Turing kernels, which
# it does not.

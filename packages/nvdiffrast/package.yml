name: nvdiffrast
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: NVlabs/nvdiffrast
source_tag: v0.4.0
extra_deps: numpy
# Curated Requires-Dist (CW-ADR-0004).
# CORRECTED 2026-08-24: this package was described as "JIT-only, ships no
# binaries, needs ninja at runtime to compile its plugins on first use".
# That was true of nvdiffrast v0.3.x; the pin is v0.4.0, which replaced
# _get_plugin() with a real CUDAExtension. Verified against six published
# wheels spanning cu124-cu132 and all three platforms: every one ships a
# 58-66MB compiled _nvdiffrast_c extension, the wheel contains exactly three
# .py files whose entire import set is
# {importlib.metadata, numpy, torch, warnings, _nvdiffrast_c}, there is not
# one reference to cpp_extension / load( / ninja / _get_plugin, and the .cu
# sources a JIT path would need are not shipped. So the JIT path is not
# merely unused, it is impossible, and ninja was pure surplus. torch is a
# real dep but is stripped farm-wide by policy (pinned workspace-wide by the
# consumer), leaving numpy as the only declarable one.
# allow_pure_python removed with the same correction: it was inert (C3 only
# consults it when the wheel has NO extensions, and this one always does),
# but it would have silently swallowed exactly the regression C3 exists to
# catch -- a CUDA compile that quietly degraded to a pure-python wheel.

# Compile parallelism. BOTH are mandatory in every package.yml -- there is no
# default to fall back on, by design (see scripts/package_loader.py).
#
#   jobs          how many compiler processes run at once. The actual number,
#                 not a ceiling: exported as MAX_JOBS and
#                 CMAKE_BUILD_PARALLEL_LEVEL. An explicit value also preempts
#                 packages whose setup.py picks its own when the env is unset
#                 -- some choose 10, which on a 4-vCPU runner is -j10.
#   nvcc_threads  nvcc --threads: parallel device compiles WITHIN one TU, one
#                 per gencode target. Appended as a TRAILING --threads so it
#                 beats any setup.py hardcode.
#
# They multiply: peak memory is roughly jobs x nvcc_threads x one cicc. On a
# 16GB runner with CUTLASS-heavy sources that product is what decides whether
# the compile swaps or dies.
jobs: 3
nvcc_threads: 1

name: nvdiffrast
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: NVlabs/nvdiffrast
source_tag: v0.4.0
extra_deps: numpy
# Curated Requires-Dist (CW-ADR-0004): the opposite fix -- upstream
# under-declares. This wheel is JIT-only and genuinely needs ninja at
# runtime to compile its plugins on first use.
requires_dist:
  - numpy
  - ninja
verify:
  allow_pure_python: true   # JIT-only: compiles at first use, ships no binaries

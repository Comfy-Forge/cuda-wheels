name: pyg_lib
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: pyg-team/pyg-lib
source_tag: 0.5.0
version: 0.5.0
patch_script: packages/pyg_lib/patches/pyg_lib.py
clone_recursive: true
# cmake --build with no -j upstream; reached via the CMAKE_BUILD_PARALLEL_LEVEL
# mirror. Vendored CUTLASS TUs -> heavy tail, keep at 3.
jobs: 3
nvcc_threads: 1
verify:
  import_name: pyg_lib   # top_level.txt also lists libpyg, which is a DLL not a module

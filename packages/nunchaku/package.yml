name: nunchaku
# NOTE: its Windows C1083 (relative -I include dirs) came from
# setuptools 65.5.0 on the py3.10/3.11 toolcache; the farm-wide
# 'setuptools>=78' floor in setup-build-env fixes it for everyone.
patch_script: packages/nunchaku/patches/nunchaku.py
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
# SVDQuant 4-bit inference engine for diffusion models.
# NOTE: repo moved -- mit-han-lab/nunchaku and nunchaku-tech/nunchaku both 301
# to nunchaku-ai. PyPI `nunchaku` is an UNRELATED project (a changepoint
# library); never resolve this from PyPI.
# Upstream publishes GH-release wheels for cu12.8/13.0 x torch2.8-2.11 x
# cp310-313 only, so the farm's job here is cu12.4/12.6/12.9 and cp314.
source_repo: nunchaku-ai/nunchaku
source_tag: v1.2.1
version: 1.2.1
clone_recursive: true          # cutlass + Block-Sparse-Attention submodules
# FAST install mode enumerates local GPUs -- zero on CI -> setup.py
# asserts before compiling anything. ALL builds every supported arch.
# (setup.py ignores TORCH_CUDA_ARCH_LIST entirely; see README.)
# NUNCHAKU_BUILD_WHEELS=1 added 2026-08-26. Upstream setup.py:136 reads
# `if os.getenv("NUNCHAKU_BUILD_WHEELS", "0") == "0": NVCC_FLAGS.append(
# "--generate-line-info")` -- i.e. the DEFAULT is the developer build, and the
# farm was taking it. That is upstream's own release switch and we were simply
# never setting it. (Its -g / -Og / -UNDEBUG at setup.py:111,116 are
# unconditional and NOT covered by this flag; see patches/nunchaku.py.)
pre_build_script: echo "NUNCHAKU_INSTALL_MODE=ALL" >> $GITHUB_ENV && echo "NUNCHAKU_BUILD_WHEELS=1" >> $GITHUB_ENV
# Upstream hardcodes --threads=len(sm_targets) (~6); the farm's trailing
# --threads=1 wins. Cap jobs for the CUTLASS-heavy kernels.
jobs: 3
nvcc_threads: 1
# FluxModel.cpp includes nvtx3/nvToolsExt.h -- NVTX is an opt-in toolkit
# component on the farm (cuda-nvtx-<ver> on rhel8).
extra_cuda_components: nvtx

  # py3.10-3.14. Arch lists inherit too, except the two overridden above --
  # arch_list_by_cuda outranks _defaults' per-combo list (generate_matrix.py
  # resolve_arch_list, step 2 beats step 4).
  platforms: ["linux", "windows"]

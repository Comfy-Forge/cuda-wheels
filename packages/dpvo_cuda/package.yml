name: dpvo_cuda
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: princeton-vl/DPVO
source_tag: 859bbbfdac6c6185f345003b3c473901fcd13ace
# No version pin: upstream's setup.py declares none (setuptools default
# 0.0.0) and the legacy farm shipped 0.0.0 too. A pinned 1.0.0 was
# invented and the gate blocked the mismatch -- and it would sort ABOVE
# any real upstream version forever.
patch_script: packages/dpvo_cuda/patches/dpvo_cuda.py
extra_deps: numpy

# Compile parallelism. BOTH are mandatory in every package.yml -- there is no
# default to fall back on, by design (see scripts/package_loader.py).
#
#   jobs          how many compiler processes run at once. The actual number,
#                 not a ceiling: exported as MAX_JOBS and
#                 CMAKE_BUILD_PARALLEL_LEVEL. An explicit value also preempts
#                 packages whose setup.py picks its own when the env is unset
#                 -- some choose 10, which on a 4-vCPU runner is -j10.
#   nvcc_threads  nvcc --threads: parallel device compiles WITHIN one TU, one
#                 per gencode target. Appended as a TRAILING --threads so it
#                 beats any setup.py hardcode.
#
# They multiply: peak memory is roughly jobs x nvcc_threads x one cicc. On a
# 16GB runner with CUTLASS-heavy sources that product is what decides whether
# the compile swaps or dies.
# jobs 1 / nvcc_threads 3 (owner call 2026-08-26). MEMORY-NEUTRAL reshape:
# 3 jobs x 1 thread and 1 job x 3 threads both run three cicc processes. What
# changes is WHERE the parallelism lives -- and here it could not live at the
# process level at all.
# Measured: 3 extensions, 40% avg CPU.
# setuptools builds extensions SERIALLY
# (_distutils/command/build_ext.py::_build_extensions_serial), so MAX_JOBS only
# ever reaches the ninja run inside ONE extension -- and these hold too few
# sources for it to matter. nvcc --threads parallelises across GENCODE TARGETS
# inside a single TU, which is work that actually exists here.
jobs: 1
nvcc_threads: 3

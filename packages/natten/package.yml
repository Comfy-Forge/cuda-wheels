name: natten
links_torch: true   # compiled against libtorch: one wheel per (cuda x torch) pair
source_repo: SHI-Labs/NATTEN
source_tag: v0.21.6
patch_script: packages/natten/patches/natten.py
# NATTEN vendors CUTLASS as a submodule under third_party/.
clone_recursive: true
# Blackwell autogen .cu files are now restricted to sm_100/103 (see
# patches/natten.py's set_source_files_properties block); this cuts the
# heaviest part of the compile to ~1/5 of its prior cost. Combined with
# the existing arch list, total Linux wall time should fit comfortably in
# one 6h job. The sequential-checkpoint chain was REMOVED farm-wide
# (2026-08-21: measurements showed no package needs it -- nunchaku's
# "multi-hour" CUTLASS build is 99 min at sane knobs). If natten ever
# outgrows 6h again, `sharding: N` is the escape hatch: patches/natten.py
# still reads CUDA_WHEELS_SHARD_INDEX/COUNT to filter its autogen kernels.
#
# Was previously `sharding: 16`, then `sequential_checkpoint: 18000`.
# Windows is back in scope: patches/natten.py strips sm_100/103 (Blackwell DC)
# from NATTEN_CUDA_ARCH on Windows so the MSVC-incompatible
# sm100_fmha_bwd_kernel_tma_warpspecialized.hpp (C2061) doesn't get pulled in.
# sm_120 (RTX 5090 / Blackwell consumer) is unaffected and still ships.
# CUTLASS template instantiations have large peak memory. max_jobs=4 OOM'd
# (exit 143 + runner shutdown signal) ~3min into Blackwell FMHA compile on
# 16GB Linux runner — each .cu peaks above the assumed 3.5GB. Backed off
# to 2 slots (with 8GB swap added in build.yml) paired with nvcc --threads=1
# (via nvcc_flags below) for single-threaded per-file compiles.
# max_jobs 1 (was 2): at sharding 20 a shard holds ~7 TUs and two
# simultaneous CUTLASS peaks tripped the swap gate (0.18GB swapped);
# in-job parallelism buys nothing sharded this thin.
max_jobs: 1
# Force nvcc to single-threaded per file (NATTEN's CMakeLists doesn't pass
# --threads; without this, nvcc default is 1 anyway, but we make it explicit
# so the parallelism story is documented and stays stable across nvcc
# versions). Forwarded to every nvcc invocation via NVCC_APPEND_FLAGS.
nvcc_flags: --threads=1
# cmake is required by NATTEN's setup.py (checks for the executable at build
# time). Ninja generator is used.
extra_deps: cmake ninja
sharding: 20  # owner order 2026-08-26 -- reverted from a brief 40
# 40 does NOT work for natten and the reason is structural, not tunable:
# the shard filter partitions the ~144 autogen .cu files by GLOBAL sorted
# index (i %% shard_count), while the Hopper family has only ~22 of them.
# Simulated over the real category sizes: at 20 shards, 0/20 shards receive
# zero Hopper files; at 40, 18/40 do -- and this patch builds natten_hopper
# as a separate OBJECT library (CUDA_ARCHITECTURES 90a-real), so an empty
# source list is a hard cmake CONFIGURE error:
#   CMake Error at CMakeLists.txt:234 (add_library):
#     No SOURCES given to target: natten_hopper
# The empty-target guard added to patches/natten.py makes >20 SURVIVABLE,
# but raising this past ~22 still silently stops sharding the Hopper family
# (most shards skip it), so the wall-clock win does not materialise there.
# If this needs to go higher, partition PER-CATEGORY first.
# Raised alongside flash_attn's 20->40. natten autogens ~144 CUTLASS TUs
# at the cu13.0 arch list (grep_c '__CUDA_ARCH__ *<' over csrc/ is 0, so
# none are stubs), and max_jobs is pinned to 1 because two simultaneous
# CUTLASS peaks trip the swap gate on a 16GB runner -- so wall-clock is
# purely a function of shard count. ~3.6 TUs/shard at 40.
# The PATCH partitions (deletes foreign autogen .cu files before cmake);
# the nvcc-seat wrapper must stay a pure ccache pass-through. Running both
# partitions the intersection (~1/N^2 per shard) -- and the seat wrapper
# also stubbed cmake's compiler-probe TUs, which killed configure
# ("Detecting CUDA compiler ABI info - failed", waves 1-2).
shard_filter: source

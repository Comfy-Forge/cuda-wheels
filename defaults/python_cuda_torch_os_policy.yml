# The farm's Python x CUDA x Torch x OS ("PCTO") axes.
#
# The `platforms`, python bounds, `supported_cudas` and `defaults` sections
# are OWNED policy (hand-maintained). The `combinations` section is
# GENERATED from the PCWM by scripts/derive_defaults.py -- do not hand-edit
# rows; edit policy and re-run. Arch lists are NOT here: see
# defaults/arch_policy.yml (CW-ADR-0012).

# CUDA lines the farm can actually build. A CUDA present in PCWM but absent
# here is skipped with a loud warning. Adding a line requires wiring its
# Windows installer URL in .github/actions/setup-cuda first (Linux derives
# apt package names from the version and needs nothing).
supported_cudas: ["12.4", "12.6", "12.8", "12.9", "13.0", "13.2"]
# Python axis policy (CW-ADR-0005): stable, released CPython only.
python_min: "3.10"
python_max: "3.14"
# linux = x86_64 (manylinux_2_28); linux_aarch64 = ARM (SBSA/Jetson,
# manylinux_2_28_aarch64). ARM was per-package opt-in during the pilot
# (CW-ADR-0015); promoted to a default platform after 112/112 green.
# cu124 still never builds on ARM (absent from arch_policy_aarch64 --
# NVIDIA's sbsa repo starts at 12.5).
platforms: ["linux", "windows", "linux_aarch64"]

# Default per-package settings inherited unless overridden.
defaults:
  max_jobs: 0           # 0 = unset; torch sizes the job count from cpu_count()
  clone_recursive: false
  free_disk_space: true


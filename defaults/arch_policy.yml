# The farm's OWNED arch policy (CW-ADR-0012). Hand-maintained; arch list
# changes go through the ADR process, never through automation. This file is
# the ONLY arch source: scripts/generate_matrix.py reads it directly at
# build time. Cell axes live in defaults/python_cuda_torch_os_policy.yml.

arch_policy:
  # 5.0 (Maxwell) matches torch's own cu124/cu126 wheels (build_cuda.sh
  # ships 5.0;6.0;7.0;... there). Packages whose kernels can't go that
  # low carry an arch_override (diso: atomicAdd(double*) needs sm_60;
  # gsplat_maskgaussian: cg::labeled_partition needs sm_70).
  "12.4": "5.0;6.0;7.0;7.5;8.0;8.6;9.0+PTX"
  "12.6": "5.0;6.0;7.0;7.5;8.0;8.6;9.0+PTX"
  # 7.5 floor: torch dropped sm_70 from cu128/cu129 starting at 2.7/2.11
  # (their build_cuda.sh base list is 7.5;8.0;8.6;9.0;10.0;12.0). The OLD
  # minors that still shipped Volta are pinned in arch_exceptions below --
  # a closed set, so new torch minors need no bookkeeping here.
  "12.8": "7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.9": "7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "13.0": "7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "13.2": "7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
# aarch64 (SBSA/Jetson) policy -- a different world from x86: no pre-Ampere
# server ARM exists, Grace pairs with Hopper (9.0), and 13.x adds Thor (11.0)
# as a NATIVE target. Derived from PyTorch's own aarch64 tables (CW-ADR-0012
# derivation rule applied per platform).
# A CUDA line ABSENT from this table is deliberately not built for aarch64.
# 12.4 is absent: NVIDIA's ubuntu2404/sbsa apt repo starts at CUDA 12.5, so
# the toolkit is uninstallable on GitHub's hosted ARM runners -- and the
# audience (torch 2.4/2.5 on Grace) is negligible.
arch_policy_aarch64:
  "12.6": "8.0;9.0+PTX"
  "12.8": "8.0;9.0+PTX;10.0;12.0+PTX"
  "12.9": "8.0;9.0+PTX;10.0;12.0+PTX"
  "13.0": "8.0;9.0+PTX;10.0;11.0;12.0+PTX"
  "13.2": "8.0;9.0+PTX;10.0;11.0;12.0+PTX"
# Per-(cuda, torch-minor) exceptions, hand-maintained (CW-ADR-0012's clamp,
# applied by hand). Inverted 2026-08-22: the policy rows above carry the
# CURRENT floor (7.5 on cu128/cu129); these rows pin the closed set of OLD
# torch minors that still shipped sm_70, so a Volta cubin stays reachable
# inside those torch processes. New torch minors inherit the policy row
# unchanged -- this table never grows again for the Volta drop.
arch_exceptions:
  "12.8/2.8":  "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.8/2.9":  "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.8/2.10": "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.9/2.8":  "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.9/2.9":  "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.9/2.10": "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"

name: Sequential-checkpoint chain link
# Reusable workflow (workflow_call). build.yml invokes this N times per
# (package, cell) — once per chain link — passing `iter`. Each call is a
# separate GH Actions job; build.yml wires them with `needs:` so they run
# sequentially within the SAME run, with the `done` output gating whether
# subsequent links run or are skipped.
#
# This file owns the per-link logic so build.yml's ladder (6 links per
# platform) stays a thin list of `uses:` calls. The matrix from
# generate-matrix is threaded in as a JSON-string input.

on:
  workflow_call:
    inputs:
      iter:
        description: 'Chain-link iteration number (0 for the first link).'
        type: number
        required: true
      matrix_json:
        description: 'The full matrix JSON from generate-matrix (we read .linux_chain from it).'
        type: string
        required: true
      runner:
        description: 'Runner type: github (default) or self-hosted.'
        type: string
        required: false
        default: 'github'
      max_jobs_override:
        description: 'Workflow-dispatch override for max parallel compile jobs (0 = use package default).'
        type: string
        required: false
        default: '0'
      overwrite:
        description: 'When true, skip the "wheel exists in release" early-out.'
        type: boolean
        required: false
        default: false
    outputs:
      done:
        description: '"true" once the chain has produced (or found) a wheel; "false" if the link timed out and uploaded a checkpoint for the next link.'
        value: ${{ jobs.build.outputs.done }}

jobs:
  build:
    name: chain ${{ inputs.iter }} ${{ matrix.package }} py${{ matrix.python }} cu${{ matrix.cuda_short }} torch${{ matrix.pytorch }}
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","cuda"]') || 'ubuntu-22.04' }}
    # Same container as build.yml's build-linux: the glibc-2.28 floor is
    # policy (tracks PyTorch's manylinux baseline), and setup-build-env
    # expects the image's /opt/python interpreters. Without this block the
    # chain built on bare ubuntu-22.04 -- system python, glibc 2.35, and
    # auditwheel rejecting the result against the 2.28 policy.
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      options: --privileged
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json).linux_chain }}
    permissions:
      contents: read
    outputs:
      # `done` = build completed (or pre-existing wheel found) somewhere in
      # this link. build.yml gates the next link on this; if 'true', no
      # further compile happens.
      done: ${{ steps.bw.outputs.done || (steps.check.outputs.exists == 'true' && 'true' || 'false') }}
    steps:
      # (The host free-disk step is gone: host paths are unreachable from
      # the container. Stock runner disk must suffice -- same trade as
      # build.yml's containerized jobs.)
      - name: Container prerequisites (gh CLI, procps)
        run: |
          dnf install -y -q 'dnf-command(config-manager)' >/dev/null
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo >/dev/null
          dnf install -y -q gh procps-ng >/dev/null
          gh --version | head -1

      - uses: actions/checkout@v4

      - name: Compute wheel filename
        id: meta
        run: |
          PKG_NAME="${{ matrix.package }}"
          PKG_VERSION="${{ matrix.version }}"
          CUDA_SHORT="${{ matrix.cuda_short }}"
          TORCH_SHORT=$(echo "${{ matrix.pytorch }}" | cut -d. -f1,2)
          PY_SHORT=$(echo "${{ matrix.python }}" | tr -d '.')
          WHEEL_PREFIX="${PKG_NAME}-${PKG_VERSION}+cu${CUDA_SHORT}torch${TORCH_SHORT}-cp${PY_SHORT}-cp${PY_SHORT}-"
          echo "wheel_prefix=$WHEEL_PREFIX" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Check if wheel exists in release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHEEL_PREFIX="${{ steps.meta.outputs.wheel_prefix }}"
          RELEASE="${{ matrix.package }}-latest"
          echo "Checking release $RELEASE for: ${WHEEL_PREFIX}*.whl"
          mkdir -p dist
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Overwrite enabled, will rebuild"
          else
            MATCHING=$({ gh release view "$RELEASE" --json assets -q ".assets[].name" 2>/dev/null || true; } | grep "^${WHEEL_PREFIX}" | grep "manylinux" | head -1 || true)
            if [ -n "$MATCHING" ]; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "::notice::Wheel exists in release: $MATCHING"
              gh release download "$RELEASE" -p "$MATCHING" -D dist
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "::notice::No manylinux wheel found matching: ${WHEEL_PREFIX}*"
            fi
          fi

      - name: Setup CUDA
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cuda }}
          platform: linux
          installer-type: ${{ matrix.cuda_installer }}
          extra-components: ${{ matrix.extra_cuda_components }}

      - name: Setup build environment
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python }}
          pytorch-version: ${{ matrix.pytorch }}
          cuda-short: ${{ matrix.cuda_short }}
          platform: linux
          extra-deps: ${{ matrix.extra_deps }}

      - name: Add swap space
        # Sequential-checkpoint packages are inherently memory-heavy (that's
        # why they checkpoint). Allocate 8GB swap unconditionally for any
        # chain-mode package; cheap insurance against OOM kills mid-compile.
        if: steps.check.outputs.exists != 'true'
        run: |
          # container runs as root (--privileged for swapon)
          fallocate -l 8G /mnt/swapfile
          chmod 600 /mnt/swapfile
          mkswap /mnt/swapfile
          swapon /mnt/swapfile

      - name: Build wheel
        id: bw
        if: steps.check.outputs.exists != 'true'
        uses: ./.github/actions/build-wheel
        with:
          source-repo: ${{ matrix.source_repo }}
          source-tag: ${{ matrix.source_tag }}
          pre-build-script: ${{ matrix.pre_build_script }}
          arch-list: ${{ matrix.arch_list }}
          cuda-version: ${{ matrix.cuda }}
          cuda-short: ${{ matrix.cuda_short }}
          pytorch-version: ${{ matrix.pytorch }}
          platform: linux
          max-jobs: ${{ inputs.max_jobs_override != '0' && inputs.max_jobs_override || matrix.max_jobs }}
          clone-recursive: ${{ matrix.clone_recursive }}
          patch-script: ${{ matrix.patch_script }}
          build-subdir: ${{ matrix.build_subdir }}
          nvcc-flags: ${{ matrix.nvcc_flags }}
          shard-index: '0'
          shard-count: '0'
          package: ${{ matrix.package }}
          python-version: ${{ matrix.python }}
          sequential-checkpoint: ${{ matrix.sequential_checkpoint }}
          checkpoint-iter: ${{ inputs.iter }}

      - name: Upload wheel artifact
        # Only the link that COMPLETED the build (or saw the wheel already
        # exists in the release) uploads. Intermediate-link uploads would
        # produce empty artifacts and collide on name; the if-no-files-found
        # is a belt-and-suspenders against a config skew.
        if: steps.bw.outputs.done == 'true' || steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-linux-py${{ matrix.python }}-cu${{ matrix.cuda_short }}-torch${{ matrix.pytorch }}
          path: dist/*.whl
          if-no-files-found: ignore

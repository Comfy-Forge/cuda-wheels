name: Update Index

# Deploys ONLY on manual dispatch -- pushing to main must never touch the
# live index. Run it deliberately once the builds you care about landed
# (or dispatch build.yml with update_index=true).
on:
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    environment: deploy-index
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The previous index is the LIVE gh-pages branch, not a committed copy
      # in main: check it out so the never-publish-a-shorter-index guard
      # compares against reality. Absent on the very first deploy.
      - name: Checkout current gh-pages (for the shorter-index guard)
        id: prev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-site

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Render matrix page from the committed PCWM snapshot
        run: python scripts/fetch_torch_matrix.py --from-json defaults/scraped_torch_matrix.json --html _site/matrix

      - name: Build the "Find your wheel" page
        run: python scripts/generate_findwheel.py --out _site

      - name: Build the GPU architectures page
        run: python scripts/generate_archs_page.py --out _site

      - name: Generate PEP 503 index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUW_SITE_DIR: _site
        run: python scripts/generate_index.py --out _site --previous previous-site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true

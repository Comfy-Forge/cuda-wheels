name: Update Index

# Deploys ONLY on manual dispatch -- pushing to main must never touch the
# live index. Run it deliberately once the builds you care about landed
# (or dispatch build.yml with update_index=true).
on:
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    environment: deploy-index
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The previous index is the LIVE gh-pages branch, not a committed copy
      # in main: check it out so the shrinkage guard compares against reality.
      # continue-on-error is safe here ONLY because it is no longer load-bearing:
      # generate_index.py asks the API whether gh-pages exists, and a missing
      # baseline with a live branch is a hard error there. A failed checkout
      # therefore surfaces as a readable diagnosis in the Python step instead of
      # silently disabling the guard. Do not move that decision back into YAML.
      - name: Checkout current gh-pages (baseline for the shrinkage guard)
        id: prev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-site

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Render matrix page from the committed PCWM snapshot
        run: python scripts/fetch_torch_matrix.py --from-json defaults/scraped_torch_matrix.json --html _site/matrix

      - name: Build the "Find your wheel" page
        run: python scripts/generate_findwheel.py --out _site

      - name: Build the GPU architectures page
        run: python scripts/generate_archs_page.py --out _site

      - name: Generate PEP 503 index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUW_SITE_DIR: _site
        run: python scripts/generate_index.py --out _site --previous previous-site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true

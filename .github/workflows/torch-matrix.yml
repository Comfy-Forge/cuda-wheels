name: Torch Matrix

# Regenerates the published PyTorch CUDA wheel matrix from upstream.
#
# Deliberately SEPARATE from update-index.yml, and deliberately NOT a deployer.
#
# The matrix depends on download.pytorch.org; the package index depends only on
# this repo's own releases. Running them in one job coupled the two, so a
# PyTorch outage stopped the index -- which pip consumes -- from updating at all.
# Splitting them is the fix.
#
# Only ONE workflow may deploy to gh-pages (update-index.yml). This workflow
# commits ONLY the machine-readable snapshot (defaults/scraped_torch_matrix.json) -- the
# committed PCWM is an INPUT to grid derivation, so it belongs in main; the
# human-readable matrix PAGE is rendered from that json at deploy time and
# lives only on gh-pages. The resulting push triggers update-index.yml.
#
# There is no cron here yet. Adding one now only refreshes the matrix -- it no
# longer drags an index rebuild along with it, which was the objection last time:
#   schedule:
#     - cron: "23 5 * * *"

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # derivation dry-run opens an issue when it breaks

concurrency:
  group: torch-matrix
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate matrix
        run: python scripts/fetch_torch_matrix.py --output defaults/scraped_torch_matrix.json

      # Exercise the FULL grid derivation against the fresh snapshot without
      # writing anything. If upstream's schema drifted or the policy file's
      # splice anchor rotted, this is where it surfaces -- the day upstream
      # moved, not months later at a maintainer's keyboard. Failure opens a
      # deduplicated issue (torch-watch's pattern: the title carries the
      # fingerprint, so the same breakage does not re-file every run).
      - name: Validate grid derivation (dry run)
        id: derive-check
        run: |
          set +e
          out=$(python scripts/derive_defaults.py --dry-run 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            title="derive_defaults.py broken against fresh PCWM snapshot"
            if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                 --search "\"$title\" in:title" --json number -q '.[0].number' | grep -q .; then
              {
                echo "torch-matrix.yml refreshed defaults/scraped_torch_matrix.json and the derivation dry run failed. The committed grid is now stale relative to upstream until this is fixed."
                echo
                echo '```'
                echo "$out"
                echo '```'
                echo
                echo "Run locally: \`python scripts/derive_defaults.py --dry-run\`. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              } > /tmp/issue-body.md
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --body-file /tmp/issue-body.md
            fi
            exit $rc
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit if upstream moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add defaults/scraped_torch_matrix.json
          if git diff --cached --quiet; then
            echo "::notice::upstream unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "matrix: refresh from upstream

          Regenerated by torch-matrix.yml. The push triggers update-index.yml,
          which is the only workflow that deploys to gh-pages."
          git push

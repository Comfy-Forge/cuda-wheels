name: 'Build Wheel'
description: 'Clone source, apply patches, build wheel, rename with CUDA+PyTorch suffix'

inputs:
  source-repo:
    description: 'Source repository (e.g., thu-ml/SageAttention)'
    required: true
  source-tag:
    description: 'Git tag or branch to checkout'
    required: false
    default: ''
  pre-build-script:
    description: 'Script to run before building (patches, etc.)'
    required: false
    default: ''
  arch-list:
    description: 'CUDA architectures to build for (auto-computed by generate_matrix.py)'
    required: true
  cuda-version:
    description: 'Full CUDA version (e.g., 12.4)'
    required: true
  cuda-short:
    description: 'Short CUDA version (e.g., 124)'
    required: true
  pytorch-version:
    description: 'PyTorch version (e.g., 2.4.0)'
    required: true
  platform:
    description: 'Platform (linux or windows)'
    required: true
  jobs:
    description: 'Max parallel compilation jobs'
    required: false
    default: '1'
  clone-recursive:
    description: 'Clone with --recursive for submodules'
    required: false
    default: 'false'
  patch-script:
    description: 'Path to patch script (Python file) to run before building'
    required: false
    default: ''
  build-subdir:
    description: 'Subdirectory to build from (for monorepos)'
    required: false
    default: ''
  nvcc-threads:
    description: 'nvcc --threads value (per-arch parallel device compiles within one TU). Farm default 1: same-TU per-arch peaks land simultaneously; spend RAM on MAX_JOBS instead. Appended as a TRAILING --threads on NVCC_APPEND_FLAGS so it wins over setup.py hardcodes in every build system.'
    required: false
    default: '1'
  nvcc-flags:
    description: 'Extra flags to pass to nvcc via NVCC_APPEND_FLAGS (e.g. -diag-suppress 221)'
    required: false
    default: ''
  shard-index:
    description: '1-based shard number for this job (default 0 = unsharded). Only meaningful with shard-count > 0.'
    required: false
    default: '0'
  shard-count:
    description: 'Total shard count for this package (default 0 = unsharded). When > 0, this job compiles only its slice of sources.'
    required: false
    default: '0'
  shard-filter:
    description: >-
      Which mechanism partitions TUs in compile-shard mode. "seat" (default):
      the nvcc-seat wrapper hash-partitions on Linux / the CUDAExtension
      monkeypatch filters on Windows. "source": the package PATCH filters its
      own source list via CUDA_WHEELS_SHARD_INDEX/COUNT (natten's cmake
      autogen delete-filter) and the seat/monkeypatch must NOT also partition
      -- running both partitions the intersection (~1/N^2 per shard) and
      defeats sharding.
    required: false
    default: 'seat'
  link-only:
    description: 'When "true", download all shard artifacts and run link only. No compile.'
    required: false
    default: 'false'
  package:
    description: 'Package name (used in shard artifact naming to disambiguate concurrent sharded builds).'
    required: false
    default: ''
  python-version:
    description: 'Python version (e.g. 3.10). Used in shard artifact naming because the cpp_extension build dir is python-version-specific.'
    required: false
    default: ''

outputs:
  wheel-path:
    description: 'Path to the built wheel (set only in full-build or link-only modes; empty in compile-shard mode).'
    value: ${{ steps.rename.outputs.wheel-path }}

runs:
  using: 'composite'
  steps:
    - name: Clone source
      # (preserving all source mtimes so ninja's restat against the .o files
      # in the same tarball still passes). Only iter=0 (first link) or
      shell: bash
      run: |
        RECURSIVE_FLAG=""
        if [ "${{ inputs.clone-recursive }}" == "true" ]; then
          RECURSIVE_FLAG="--recursive"
        fi
        git clone $RECURSIVE_FLAG https://github.com/${{ inputs.source-repo }}.git source
        cd source
        if [ -n "${{ inputs.source-tag }}" ]; then
          git checkout ${{ inputs.source-tag }}
          # Re-sync submodules to the gitlinks recorded at the tag —
          # `git clone --recursive` initialized them at the default branch's
          # HEAD, which can be far ahead of what the tagged release pinned.
          if [ "${{ inputs.clone-recursive }}" == "true" ]; then
            git submodule update --init --recursive
          fi
        fi

    - name: Apply patch script
      # Patches already applied in the prior chain link; their changes are
      # preserved in the source/ tarball.
      if: inputs.patch-script != ''
      shell: bash
      env:
        # Cell facts for version-gated patches (expressions don't expand
        # inside package-authored scripts -- same rule as the Pre-build step).
        CUW_TORCH_VERSION: ${{ inputs.pytorch-version }}
        CUW_CUDA_VERSION: ${{ inputs.cuda-version }}
      run: |
        cd source
        # Set CUDA_HOME for patch scripts that need it (e.g. cumm header bundling)
        if [ -z "$CUDA_HOME" ]; then
          if [ -d "/usr/local/cuda-${{ inputs.cuda-version }}" ]; then
            export CUDA_HOME="/usr/local/cuda-${{ inputs.cuda-version }}"
          elif [ -n "$CUDA_PATH" ]; then
            export CUDA_HOME="$CUDA_PATH"
          fi
        fi
        python $GITHUB_WORKSPACE/${{ inputs.patch-script }}

    - name: Pre-build script
      # Already ran on iter=0; effects preserved in the source/ tarball.
      # env: cell facts a package script may need (GitHub expressions do NOT
      # re-expand inside input values, so ${{ inputs.arch-list }} written in
      # a package.yml pre_build_script stays a literal -- use these instead).
      if: inputs.pre-build-script != ''
      shell: bash
      env:
        TORCH_CUDA_ARCH_LIST: ${{ inputs.arch-list }}
        CUW_CUDA_VERSION: ${{ inputs.cuda-version }}
        # For package scripts hitting api.github.com: anonymous calls are
        # rate-limited per runner IP (60/h) and died mid-grid.
        GH_TOKEN: ${{ github.token }}
      run: |
        cd source
        ${{ inputs.pre-build-script }}

    - name: Apply shard filter (compile-shard mode)
      # In compile-shard mode, monkeypatch torch.utils.cpp_extension.CUDAExtension
      # to filter its `sources=[...]` list to this shard's slice. The filter is
      # injected at the top of setup.py so it applies before CUDAExtension is
      # called.
      #
      # Partition: sorted(sources) round-robin'd to shards (file at sorted-index
      # i goes to shard (i % shard_count) + 1). Sorted-and-modulo guarantees
      # balance for small file counts -- with 7 files across 4 shards you get
      # sizes 2,2,2,1 instead of the unbalanced 0,1,3,3 you can hit with
      # hash-mod. Deterministic across runs and shards (every shard and the
      # link job see the same sort order from the same input list), so the
      # partition is consistent.
      if: inputs.shard-count != '0' && inputs.link-only != 'true' && inputs.platform == 'windows' && inputs.shard-filter == 'seat'
      shell: bash
      run: |
        cd source
        BUILD_DIR="."
        if [ -n "${{ inputs.build-subdir }}" ]; then
          BUILD_DIR="${{ inputs.build-subdir }}"
        fi
        SETUP_PY="$BUILD_DIR/setup.py"
        if [ ! -f "$SETUP_PY" ]; then
          echo "::error::shard filter expects $SETUP_PY (cpp_extension build); cmake adapter not implemented yet"
          exit 1
        fi
        SHARD_INDEX="${{ inputs.shard-index }}"
        SHARD_COUNT="${{ inputs.shard-count }}"
        python3 - "$SETUP_PY" "$SHARD_INDEX" "$SHARD_COUNT" <<'PYEOF'
        import sys, textwrap
        setup_path, shard_index, shard_count = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
        prelude = textwrap.dedent(f"""
            # --- cuda-wheels shard filter (injected) ---
            _CUW_SHARD_INDEX = {shard_index}
            _CUW_SHARD_COUNT = {shard_count}
            try:
                from torch.utils import cpp_extension as _cuw_cpp_extension
                _cuw_orig_CUDAExtension = _cuw_cpp_extension.CUDAExtension
                def _cuw_sharded_CUDAExtension(*args, **kwargs):
                    sources = kwargs.get('sources', None)
                    if sources is None and len(args) >= 2:
                        sources = args[1]
                    if sources is None:
                        sources = []
                    # Partition ONLY the .cu files: host .cpp sources carry
                    # the module's PyInit_* entry point and compile in
                    # seconds -- dropping them from a shard makes distutils'
                    # /EXPORT:PyInit_* link fail with LNK1120, which even
                    # /FORCE:UNRESOLVED cannot forgive (an export needs an
                    # address). Every shard keeps every host source.
                    # Sorted round-robin keeps the partition balanced (a, b)
                    # and deterministic across shards and the link job.
                    sources_sorted = sorted(str(s) for s in sources)
                    cu_sources = [s for s in sources_sorted
                                  if s.lower().endswith('.cu')]
                    host_sources = [s for s in sources_sorted
                                    if not s.lower().endswith('.cu')]
                    kept = host_sources + [
                        s for i, s in enumerate(cu_sources)
                        if i % _CUW_SHARD_COUNT == (_CUW_SHARD_INDEX - 1)]
                    print(f'[cuda-wheels shard {{_CUW_SHARD_INDEX}}/{{_CUW_SHARD_COUNT}}] keeping {{len(kept)}}/{{len(sources)}} sources:')
                    for s in kept:
                        print(f'    {{s}}')
                    if cu_sources and not [s for s in kept if s.lower().endswith('.cu')]:
                        raise RuntimeError(
                            f'cuda-wheels: shard {{_CUW_SHARD_INDEX}}/{{_CUW_SHARD_COUNT}} '
                            f'holds no .cu sources (only {{len(cu_sources)}} exist). Reduce '
                            f'the `sharding:` field in the package yaml to at most {{len(cu_sources)}}.'
                        )
                    if 'sources' in kwargs:
                        kwargs['sources'] = kept
                    else:
                        args = list(args)
                        if len(args) >= 2:
                            args[1] = kept
                        else:
                            kwargs['sources'] = kept
                        args = tuple(args)
                    return _cuw_orig_CUDAExtension(*args, **kwargs)
                _cuw_cpp_extension.CUDAExtension = _cuw_sharded_CUDAExtension
            except ImportError:
                pass
            # --- end cuda-wheels shard filter ---
            """)
        content = open(setup_path).read()
        if '_cuw_sharded_CUDAExtension' in content:
            print('shard filter already applied -- skipping')
        else:
            open(setup_path, 'w').write(prelude + content)
            print(f'injected shard filter at top of {setup_path}')
        PYEOF

    - name: Force-disable ninja in setup.py (link-only mode)
      # torch 2.8's BuildExtension does NOT read USE_NINJA env var (checked
      # in torch/utils/cpp_extension.py:_use_ninja: only reads kwargs).
      # The reliable way to disable ninja is to wrap BuildExtension so its
      # default kwarg becomes use_ninja=False. Inject a prelude at the top
      # of setup.py that monkeypatches torch.utils.cpp_extension.BuildExtension
      # before the package's `from torch.utils.cpp_extension import
      # BuildExtension` line resolves -- the import then binds locally to
      # the wrapped class with ninja disabled.
      #
      # We disable ninja because (a) the .ninja_log merge approach fails
      # ("build log version is too old" + command_hash mismatch under
      # setuptools' regenerated build.ninja), and (b) the distutils
      # fallback honors mtime natively and the shard's touched .o files
      # are recognized as up-to-date, collapsing compile to a no-op.
      if: inputs.link-only == 'true' && inputs.platform == 'windows' && inputs.shard-filter != 'source'
      shell: bash
      run: |
        cd source
        BUILD_DIR="."
        if [ -n "${{ inputs.build-subdir }}" ]; then
          BUILD_DIR="${{ inputs.build-subdir }}"
        fi
        SETUP_PY="$BUILD_DIR/setup.py"
        if [ ! -f "$SETUP_PY" ]; then
          echo "::error::setup.py not found at $SETUP_PY -- only cpp_extension flow supported in link-only mode"
          exit 1
        fi
        python3 - "$SETUP_PY" <<'PYEOF'
        import sys, textwrap
        setup_path = sys.argv[1]
        prelude = textwrap.dedent("""
            # --- cuda-wheels link-only ninja disabler + compile no-op (injected) ---
            # (1) Disable ninja: torch 2.8 ignores USE_NINJA env var; only
            #     respects kwargs. Wrap BuildExtension so any
            #     `BuildExtension(...)` defaults use_ninja=False.
            # (2) No-op compile(): in link-only mode the .o files are already
            #     on disk from shard extraction. distutils' mtime-based skip
            #     proved unreliable across the shard->link runner transition
            #     (mtimes don't always survive the path setuptools takes),
            #     so we monkeypatch CCompiler.compile to return the expected
            #     .o paths without invoking gcc/nvcc -- but only if every
            #     expected .o file actually exists on disk; otherwise we
            #     fall back to the real compile to avoid silent breakage.
            import os as _cuw_os
            try:
                from torch.utils import cpp_extension as _cuw_cppext_l
                _cuw_orig_BE = _cuw_cppext_l.BuildExtension
                class _CuwLinkOnlyBuildExtension(_cuw_orig_BE):
                    def __init__(self, *args, **kwargs):
                        kwargs['use_ninja'] = False
                        super().__init__(*args, **kwargs)
                    @classmethod
                    def with_options(cls, **kwargs):
                        kwargs['use_ninja'] = False
                        return _cuw_orig_BE.with_options(**kwargs)
                _cuw_cppext_l.BuildExtension = _CuwLinkOnlyBuildExtension
                print('[cuda-wheels link-only] BuildExtension wrapped with use_ninja=False')
            except ImportError:
                pass
            # Patch `compile` on the CONCRETE compiler classes, not just the
            # base. MSVCCompiler OVERRIDES compile(); UnixCCompiler does not.
            # Patching only distutils.ccompiler.CCompiler therefore reached
            # Linux and was silently shadowed on Windows -- so the no-op has
            # never fired on the one platform that needed it, and every
            # Windows link job recompiled all N TUs serially (use_ninja=False)
            # until it hit the runner cap. That is why no sharded package has
            # ever published a wheel. Verified on setuptools 68.1.2 and 81.0.0:
            #   MSVCCompiler defines its own .compile : True
            #   UnixCCompiler defines its own .compile: False
            _cuw_targets = []
            try:
                from distutils import ccompiler as _cuw_dccc
                _cuw_targets.append(_cuw_dccc.CCompiler)
            except ImportError:
                _cuw_dccc = None
            for _cuw_mod, _cuw_attr in (
                    ('distutils.compilers.C.msvc', 'Compiler'),
                    ('distutils.compilers.C.unix', 'Compiler'),
                    ('distutils._msvccompiler', 'MSVCCompiler'),
                    ('distutils.unixccompiler', 'UnixCCompiler')):
                try:
                    _cuw_m = __import__(_cuw_mod, fromlist=[_cuw_attr])
                    _cuw_c = getattr(_cuw_m, _cuw_attr, None)
                    if _cuw_c is not None and _cuw_c not in _cuw_targets:
                        _cuw_targets.append(_cuw_c)
                except ImportError:
                    pass

            _CUW_NOOP_COUNTER = _cuw_os.environ.get('CUW_NOOP_COUNTER', '')

            def _cuw_make_noop(_orig):
                def _cuw_noop_compile(self, sources, output_dir=None, macros=None,
                                      include_dirs=None, debug=0, extra_preargs=None,
                                      extra_postargs=None, depends=None):
                    outdir = output_dir if output_dir is not None else (self.output_dir or '')
                    objs = self.object_filenames(sources, strip_dir=0, output_dir=outdir)
                    missing = [o for o in objs if not _cuw_os.path.exists(o)]
                    if missing:
                        print(f'[cuda-wheels link-only] {len(missing)}/{len(objs)} .o files missing; '
                              f'falling back to real compile. First missing: {missing[0]!r}')
                        return _orig(self, sources, output_dir=output_dir,
                                     macros=macros, include_dirs=include_dirs,
                                     debug=debug, extra_preargs=extra_preargs,
                                     extra_postargs=extra_postargs, depends=depends)
                    print(f'[cuda-wheels link-only] {type(self).__name__}.compile no-op: '
                          f'all {len(objs)} object(s) present, skipping compile')
                    # Witness file: the link step asserts this fired. Without it
                    # a shadowed patch is indistinguishable from a working one.
                    if _CUW_NOOP_COUNTER:
                        # print(file=) rather than write('...\\n'): this whole
                        # block lives inside a non-raw triple-quoted literal, so
                        # a backslash escape here is interpreted when the prelude
                        # string is PARSED, not when it is written. That turned
                        # the newline into a real line break, left `')` at column
                        # 0, and textwrap.dedent then stripped nothing -- the
                        # injected setup.py died with IndentationError before any
                        # of this ran. No escapes, no recurrence.
                        with open(_CUW_NOOP_COUNTER, 'a') as _fh:
                            print(type(self).__name__, len(objs), file=_fh)
                    return objs
                return _cuw_noop_compile

            for _cuw_T in _cuw_targets:
                _cuw_own = _cuw_T.__dict__.get('compile')
                _cuw_T.compile = _cuw_make_noop(
                    _cuw_own if _cuw_own is not None else _cuw_dccc.CCompiler.compile)
            print('[cuda-wheels link-only] compile() patched on: '
                  + ', '.join(t.__name__ for t in _cuw_targets))
            # --- end cuda-wheels link-only patches ---
            """)
        content = open(setup_path).read()
        if '_CuwLinkOnlyBuildExtension' in content:
            print('ninja disabler already applied -- skipping')
        else:
            open(setup_path, 'w').write(prelude + content)
            print(f'injected ninja disabler at top of {setup_path}')
        PYEOF

    - name: Download shard artifacts (link-only mode)
      if: inputs.link-only == 'true'
      uses: actions/download-artifact@v4
      with:
        # Glob pattern matching every shard artifact for this (package, platform,
        # CPU arch, python, cuda, torch) tuple. Each shard uploaded its tarball
        # as `shard-<pkg>-<platform>-<arch>-py<py>-cu<cuda>-torch<torch>-<i>-of-<n>`.
        # runner.arch MUST stay in lockstep with the upload step's name below --
        # without it x86_64 and aarch64 shards collide (see that comment).
        # Workspace-relative: an absolute /tmp diverges on Windows (Node
        # resolves it to <drive>:\tmp while Git-bash mounts its own /tmp) --
        # natten's link job found zero artifacts that way.
        pattern: shard-${{ inputs.package }}-${{ inputs.platform }}-${{ runner.arch }}-py${{ inputs.python-version }}-cu${{ inputs.cuda-short }}-torch${{ inputs.pytorch-version }}-*-of-${{ inputs.shard-count }}
        path: shard-artifacts

    - name: Restore shard objects (link-only mode)
      # Each shard uploaded a tarball of its `build/` tree (containing the
      # produced .o files plus possibly ninja/cmake state). Extract all
      # tarballs and copy the .o files into the source's build/ tree at the
      # same relative paths. Then:
      #
      #  - Delete every shard's ninja/cmake state (.ninja_log, .ninja_deps,
      #    build.ninja, CMakeCache.txt). Cross-shard merging would have
      #    needed exact command_hash matches; in practice we let the build
      #    system regenerate state from scratch and fall back to mtime-only
      #    skip. For cpp_extension packages the CCompiler.compile no-op
      #    monkey-patch (injected separately at setup.py top) bypasses the
      #    mtime check entirely. For cmake-style packages we rely on
      #    ninja's mtime check.
      #
      #  - `touch -m` every .o so its mtime is comfortably after any .cu/
      #    .cpp source's mtime in the freshly-cloned source tree.
      if: inputs.link-only == 'true' && inputs.platform == 'windows' && inputs.shard-filter != 'source'
      shell: bash
      run: |
        # Resolve the artifact dir to a POSIX path FIRST (cd normalizes the
        # D:\... workspace form), so tar never sees a drive-letter colon.
        SA="$(cd "$GITHUB_WORKSPACE/shard-artifacts" 2>/dev/null && pwd || true)"
        cd source
        if [ -n "${{ inputs.build-subdir }}" ]; then
          cd "${{ inputs.build-subdir }}"
        fi
        mkdir -p build
        shopt -s nullglob
        TEMP_DIR=$(mktemp -d)
        found=0
        for tarball in "$SA"/*/objects.tar.gz; do
          found=$((found+1))
          shard_dir=$(mktemp -d -p "$TEMP_DIR" shard.XXXX)
          echo "extracting $tarball -> $shard_dir"
          tar -xzf "$tarball" -C "$shard_dir"
          # Copy every .o file at its tarball-relative path into the
          # final build/ tree. Partition design guarantees no two shards
          # produced the same output path.
          find "$shard_dir/build" \( -name '*.o' -o -name '*.obj' \) | while read -r objfile; do
            rel="${objfile#$shard_dir/}"
            mkdir -p "$(dirname "$rel")"
            cp -p "$objfile" "$rel"
          done
        done
        if [ "$found" = "0" ]; then
          echo "::error::no shard artifacts found under $GITHUB_WORKSPACE/shard-artifacts -- did the upstream compile-shard jobs succeed?"
          ls -laR "$GITHUB_WORKSPACE/shard-artifacts" || true
          exit 1
        fi
        # Strip stale ninja/cmake state so the link job's build system
        # regenerates fresh state and falls back to mtime-based skip.
        find build -name 'build.ninja' -delete 2>/dev/null || true
        find build -name '.ninja_deps' -delete 2>/dev/null || true
        find build -name '.ninja_log' -delete 2>/dev/null || true
        find build -name 'CMakeCache.txt' -delete 2>/dev/null || true
        find build -name 'CMakeFiles' -type d -prune -exec sh -c 'find "$1" -name "*.cmake" -delete; find "$1" -name "Makefile*" -delete' _ {} \; 2>/dev/null || true
        echo "Restored $found shard archive(s). Object tree (first 50):"
        # `set -o pipefail` is on, so SIGPIPE from `head` closing early would
        # exit the script. Append `|| true` to swallow it -- listing is purely
        # informational.
        find build \( -name '*.o' -o -name '*.obj' \) -printf '  %P (%s bytes)\n' 2>/dev/null | head -50 || true
        OBJ_COUNT=$(find build \( -name '*.o' -o -name '*.obj' \) | wc -l)
        echo "Total object files: $OBJ_COUNT"
        if [ "$OBJ_COUNT" = "0" ]; then
          echo "::error::no object files restored from shard artifacts -- tarballs may be empty"
          exit 1
        fi
        echo "(touching every .o so mtime > checkout mtime of .cu/.cpp sources)"
        find build \( -name '*.o' -o -name '*.obj' \) -exec touch -m {} +
        rm -rf "$TEMP_DIR"

    - name: Setup shard wrapper + compiler cache (Linux shard/link mode)
      # Zero-shim sharding (CW hacker-panel design C): a wrapper first in the
      # nvcc seat hash-partitions translation units across shard jobs -- no
      # per-package code, works below setup.py and cmake alike. Handoff
      # between shard jobs and the link job is a content-addressed compiler
      # cache (ccache), not the build tree: the link job re-runs the full
      # build and every compile is a cache hit, so there is no mtime dance,
      # no ninja-state merging, and a partial restore self-heals (missing
      # objects simply recompile, slowly but correctly).
      if: inputs.platform == 'linux' && inputs.shard-count != '0'
      shell: bash
      run: |
        if [ -f /etc/redhat-release ]; then
          dnf install -y -q epel-release >/dev/null && dnf install -y -q ccache >/dev/null
        else
          sudo apt-get install -y -qq ccache >/dev/null
        fi
        CUW=$RUNNER_TEMP/cuw
        mkdir -p "$CUW" "$RUNNER_TEMP/ccache"
        cc -x c -c /dev/null -o "$CUW/empty.o"
        REAL_NVCC="$(command -v nvcc || echo /usr/local/cuda/bin/nvcc)"
        cat > "$CUW/nvcc" <<'WRAP'
        #!/bin/sh
        # cuda-wheels shard wrapper: compile my partition, stub the rest.
        src=""; out=""; dep=""; prev=""
        for a in "$@"; do
          case "$prev" in
            -o) out="$a";;
            --dependency-output) dep="$a";;
          esac
          case "$a" in
            *.cu|*.cpp|*.cc|*.cxx|*.c) src="$a";;
          esac
          prev="$a"
        done
        # Build-system probes must NEVER be stubbed: cmake's compiler-id and
        # try_compile TUs (CMakeScratch/CompilerId/CMakeTmp/cmTC_, meson's
        # meson-private, autoconf's conftest) get linked into probe
        # executables -- a stubbed one has no main and kills configure
        # ("Detecting CUDA compiler ABI info - failed", natten waves 1-2).
        # Probes cost seconds; when in doubt, compile.
        case "$src|$out" in
          *CMakeScratch*|*CompilerId*|*CMakeTmp*|*cmTC_*|*meson-private*|*conftest*) src="" ;;
        esac
        if [ -n "$src" ] && [ -n "$out" ] && [ "${CUW_SHARD_COUNT:-0}" != "0" ]; then
          h=$(printf %s "$src" | md5sum | cut -c1-8)
          if [ $(( 0x$h % CUW_SHARD_COUNT )) -ne "${CUW_SHARD_INDEX0:-0}" ]; then
            cp "$CUW_EMPTY_OBJ" "$out"
            [ -n "$dep" ] && printf '%s:\n' "$out" > "$dep"
            exit 0
          fi
        fi
        if [ -n "$CUW_CACHE_TOOL" ]; then exec "$CUW_CACHE_TOOL" "$CUW_REAL_NVCC" "$@"; fi
        exec "$CUW_REAL_NVCC" "$@"
        WRAP
        sed -i 's/^        //' "$CUW/nvcc"
        chmod +x "$CUW/nvcc"
        {
          echo "CUW_REAL_NVCC=$REAL_NVCC"
          echo "CUW_EMPTY_OBJ=$CUW/empty.o"
          echo "CUW_CACHE_TOOL=$(command -v ccache)"
          # torch's ninja writer honours PYTORCH_NVCC; cmake honours CUDACXX.
          echo "PYTORCH_NVCC=$CUW/nvcc"
          echo "CUDACXX=$CUW/nvcc"
          # keep nvcc's dependency generation out of the cached command line
          # (torch >= 2.12 knob; older torch ignores it and the wrapper still
          # writes stub depfiles where asked)
          echo "TORCH_EXTENSION_SKIP_NVCC_GEN_DEPENDENCIES=1"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_NOHASHDIR=1"
          echo "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros,locale"
          echo "CCACHE_MAXSIZE=0"
        } >> $GITHUB_ENV
        # Seat-side partitioning only for shard-filter=seat: a source-filter
        # package (natten) partitions in its patch, and the wrapper must stay
        # a pure ccache pass-through or the two partitions intersect.
        if [ "${{ inputs.link-only }}" != "true" ] && [ "${{ inputs.shard-filter }}" = "seat" ]; then
          echo "CUW_SHARD_COUNT=${{ inputs.shard-count }}" >> $GITHUB_ENV
          echo "CUW_SHARD_INDEX0=$(( ${{ inputs.shard-index }} - 1 ))" >> $GITHUB_ENV
        fi
        ccache -z || true
        echo "wrapper installed at $CUW/nvcc (real: $REAL_NVCC)"

    - name: Restore shard caches (Linux link-only mode)
      # Union every shard's ccache into one dir: the layout is content-
      # addressed, so extraction over the same tree merges trivially and any
      # collision is byte-identical by construction.
      if: inputs.platform == 'linux' && inputs.link-only == 'true'
      shell: bash
      run: |
        found=0
        for tarball in "$GITHUB_WORKSPACE"/shard-artifacts/*/ccache.tar.gz; do
          [ -f "$tarball" ] || continue
          found=$((found+1))
          echo "merging $tarball"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/ccache"
        done
        if [ "$found" = "0" ]; then
          echo "::error::no shard ccache artifacts found -- did the shard jobs succeed?"
          ls -laR "$GITHUB_WORKSPACE/shard-artifacts" || true
          exit 1
        fi
        echo "merged $found shard cache(s):"
        du -sh "$RUNNER_TEMP/ccache"
        # The tarballs carry the shards' ccache stats files (stats live
        # inside the cache dir) and tar-overwrite each other, so the last
        # shard's compile misses would pollute this job's numbers -- the
        # 90% assert once failed a link job that actually replayed at 100%.
        # Zero ALL stats now so the assert measures ONLY the link build.
        ccache -z

    - name: Build wheel (Linux)
      id: build_linux
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        # Background resource monitor: prints a one-line snapshot every 120s
        # for the lifetime of this step. GH Actions kills background subshells
        # at step end, so no explicit teardown needed. Useful for diagnosing
        # OOM kills (exit code 143 + runner shutdown) on heavy CUTLASS builds.
        # Swap high-water tracking: resmon records the peak swap usage (GB)
        # to a file; the "Swap usage signal" step turns it into a workflow
        # warning annotation. Swap is a parachute -- deploying it is a
        # signal to lower max_jobs, and it should be VISIBLE, not buried in
        # 3h of logs.
        SWAP_HIGHWATER_FILE="$RUNNER_TEMP/cuw_swap_highwater"
        echo "0" > "$SWAP_HIGHWATER_FILE"
        MEM_LOWWATER_FILE="$RUNNER_TEMP/cuw_mem_lowwater"
        echo "999" > "$MEM_LOWWATER_FILE"
        ( while true; do
            # USED, not free. This line used to print "12.4/15.6GB free" while
            # every other number on it was a consumption figure, so it read as
            # "12.4GB in use" -- which makes a 4.5GB cicc in top3 look like it
            # is hiding 8GB somewhere. Report the number the reader is actually
            # looking for and keep MemAvailable in parentheses, because that is
            # the figure the swap gate's low-water message quotes.
            mem=$(awk '/MemAvailable/{a=$2/1024/1024} /MemTotal/{t=$2/1024/1024} END{printf "%.1f/%.1fGB used (%.1f avail)", t-a, t, a}' /proc/meminfo 2>/dev/null || echo "?")
            # Same flip: "11.0/11.0GB swap free" means ZERO swap in use, which
            # is the opposite of how it scans. The swap gate below reports
            # "peak swap X GB" -- used -- so the live line now matches it.
            swap=$(awk '/SwapFree/{f=$2/1024/1024} /SwapTotal/{t=$2/1024/1024} END{printf "%.2f/%.1fGB swap used", t-f, t}' /proc/meminfo 2>/dev/null || echo "?")
            used=$(awk '/SwapTotal/{t=$2} /SwapFree/{f=$2} END{printf "%.2f", (t-f)/1024/1024}' /proc/meminfo 2>/dev/null || echo 0)
            prev=$(cat "$SWAP_HIGHWATER_FILE" 2>/dev/null || echo 0)
            awk -v a="$used" -v b="$prev" 'BEGIN{exit !(a>b)}' && echo "$used" > "$SWAP_HIGHWATER_FILE"
            avail=$(awk '/MemAvailable/{printf "%.2f", $2/1024/1024}' /proc/meminfo 2>/dev/null || echo 999)
            prevlow=$(cat "$MEM_LOWWATER_FILE" 2>/dev/null || echo 999)
            awk -v a="$avail" -v b="$prevlow" 'BEGIN{exit !(a<b)}' && echo "$avail" > "$MEM_LOWWATER_FILE"
            load=$(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null || echo "?")
            # Actual CPU utilisation, from a /proc/stat delta across samples.
            # Load average alone does not distinguish "4 threads compiling
            # flat out" from "4 threads blocked on disk", and on a 4-vCPU
            # runner that is exactly the question when a build looks slow.
            read _ u n s i rest < /proc/stat
            cur_busy=$((u+n+s)); cur_tot=$((u+n+s+i))
            if [ -n "${prev_tot:-}" ] && [ "$cur_tot" -gt "$prev_tot" ]; then
              cpu=$(awk -v db=$((cur_busy-prev_busy)) -v dt=$((cur_tot-prev_tot)) \
                    'BEGIN{printf "%.0f%%", 100*db/dt}')
            else
              cpu="--"
            fi
            prev_busy=$cur_busy; prev_tot=$cur_tot
            # runnable/total from loadavg field 4, plus the real thread count.
            # nvcc fans out into cicc/ptxas/cl children, so "how many threads
            # is this build actually running" is not answerable from max_jobs.
            runq=$(cut -d' ' -f4 /proc/loadavg 2>/dev/null || echo "?")
            nthr=$(awk '/^Threads:/{n+=$2} END{print n+0}' /proc/[0-9]*/status 2>/dev/null || echo "?")
            # top3 is an INSTANTANEOUS sample, 120s apart, and cicc's peak is
            # far shorter than that -- so the largest number here is routinely
            # not the largest number that occurred. Two decimals, because
            # rounding sub-100MB processes to "0.0GB" made the list look broken.
            top3=$(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -3 | awk '{printf "%s(%.2fGB) ", $2, $1/1024/1024}' || echo "?")
            echo "[resmon $(date -u +%H:%M:%SZ)] mem: $mem | swap: $swap | cpu: $cpu (runq $runq, $nthr thr) | load: $load | top3: $top3"
            sleep 120
        done ) &
        RESMON_PID=$!
        trap "kill $RESMON_PID 2>/dev/null || true" EXIT
        BUILD_DIR="source"
        if [ -n "${{ inputs.build-subdir }}" ]; then
          BUILD_DIR="source/${{ inputs.build-subdir }}"
        fi
        cd $BUILD_DIR
        export TORCH_CUDA_ARCH_LIST="${{ inputs.arch-list }}"
        export CUDA_HOME=/usr/local/cuda-${{ inputs.cuda-version }}
        # Force cmake's Ninja generator on Linux. Default is "Unix Makefiles"
        # which lacks build.ninja + .ninja_log -- breaks incremental rebuilds
        # resume because there's no command_hash check (only mtime), and
        # cmake reconfigure on resume bumps CMakeFiles/*.make rule files
        # past the restored .o mtimes, triggering full rebuild. With Ninja
        # we get the same chain-resume mechanism that works for
        # cpp_extension packages. NATTEN's setup.py
        # only adds -G Ninja inside `if IS_WINDOWS:`; this env var fills
        # the gap on Linux. cmake honors CMAKE_GENERATOR globally.
        export CMAKE_GENERATOR=Ninja
        # `0` means "unset" here, not "unlimited". [ -n "0" ] is TRUE, so the
        # old guard exported MAX_JOBS=0, which torch passes to ninja as `-j 0`
        # -- and ninja reads that as INT_MAX. On a 16GB hosted runner that OOMs
        # under CUDA template instantiation, which is why several packages carry
        # a hand-set `max_jobs: 2`. Leaving it unset lets torch size the job
        # count from cpu_count(). build.yml already treats '0' as unset for the
        # dispatch input; this makes the action agree.
        if [ -n "${{ inputs.jobs }}" ] && [ "${{ inputs.jobs }}" != "0" ]; then
          export MAX_JOBS=${{ inputs.jobs }}
          # CMake-family builds (pyg_lib, llama_cpp_python, skbuild trees)
          # never see ninja -j from MAX_JOBS; this is their jobs knob.
          export CMAKE_BUILD_PARALLEL_LEVEL=${{ inputs.jobs }}
        fi
        # Force CUDA build even without a GPU (torch.cuda.is_available() is False on CI)
        export FORCE_CUDA=1
        # Add CUDA stubs to library path for linking (libcuda.so)
        export LIBRARY_PATH=/usr/local/cuda-${{ inputs.cuda-version }}/lib64/stubs:${LIBRARY_PATH:-}
        # For cumm/spconv: set CUDA version for prebuilt mode
        export CUMM_CUDA_VERSION="${{ inputs.cuda-version }}"
        export CUMM_CUDA_ARCH_LIST="${{ inputs.arch-list }}"
        # For cumm/spconv: disable JIT to force ahead-of-time CUDA compilation
        export CUMM_DISABLE_JIT=1
        export SPCONV_DISABLE_JIT=1
        # NVCC_THREADS is pinned to 1: --threads parallelizes the SAME
        # translation unit's per-arch cicc passes, whose memory peaks land
        # together (2 threads = 2x the peak at the same instant). Ninja-level
        # parallelism (MAX_JOBS) compiles DIFFERENT files whose peaks
        # de-correlate -- strictly better use of the same RAM. Overridable
        # via env for experiments.
        if [ -z "$NVCC_THREADS" ]; then
          export NVCC_THREADS=${{ inputs.nvcc-threads }}
        fi
        # Per-package nvcc flags (e.g. warning suppression)
        if [ -n "${{ inputs.nvcc-flags }}" ]; then
          export NVCC_APPEND_FLAGS="${{ inputs.nvcc-flags }}"
        fi
        # TRAILING --threads: nvcc applies NVCC_APPEND_FLAGS last, and the
        # last --threads wins -- so this one knob reaches every build system
        # and neutralizes setup.py hardcodes (nunchaku's len(sm_targets),
        # torchao's -t=0, sageattn3's --threads 4).
        export NVCC_APPEND_FLAGS="${NVCC_APPEND_FLAGS:-} --threads=${{ inputs.nvcc-threads }}"
        # Shard env vars for source-filter packages (shard-filter=source,
        # e.g. NATTEN): their PATCH partitions the source list itself (the
        # cmake autogen delete-filter); the seat wrapper stays pure ccache.
        # Set only in compile-shard mode; link-only mode wants the full
        # file set restored so the cache replay covers every TU.
        if [ "${{ inputs.shard-count }}" != "0" ] && [ "${{ inputs.link-only }}" != "true" ] && [ "${{ inputs.shard-filter }}" = "source" ]; then
          export CUDA_WHEELS_SHARD_INDEX="${{ inputs.shard-index }}"
          export CUDA_WHEELS_SHARD_COUNT="${{ inputs.shard-count }}"
          echo "[compile-shard] CUDA_WHEELS_SHARD_INDEX=$CUDA_WHEELS_SHARD_INDEX of $CUDA_WHEELS_SHARD_COUNT"
        fi
        # Link-only mode: pre-build artifacts already on disk (build/temp.*/),
        # touch-stamped newer than .cu/.cpp sources. Disable ninja so torch's
        # BuildExtension falls back to distutils' CCompiler, which honors
        # output-presence + mtime and SKIPS .o files that are up-to-date.
        # The earlier ninja-log merge approach didn't work — ninja's
        # command_hash check rejected the merged log because setuptools'
        # regenerated build.ninja produced subtly different command strings
        # than what the shards recorded.
        if [ "${{ inputs.link-only }}" = "true" ]; then
          # USE_NINJA is NOT read by torch's BuildExtension (cpp_extension
          # reads the kwarg, not the env) -- the prelude's use_ninja=False
          # kwarg is what actually disables ninja. Kept only because some
          # setup.py files check it themselves. The old comment here claimed
          # a "distutils mtime-based skip" that does not exist: modern
          # distutils does no mtime skipping at all, which is precisely why
          # the compile no-op has to exist.
          export USE_NINJA=0
          export CUW_NOOP_COUNTER="$RUNNER_TEMP/cuw_noop_witness"
          rm -f "$CUW_NOOP_COUNTER"
          # Diagnostic: show the merged .ninja_log + build/temp tree before
          # the build runs, so if pip still rebuilds we can see what state
          # it started from.
          echo "[diag] build/temp tree before pip wheel:"
          find build -type f -printf '  %P (%s bytes, mtime=%T@)\n' 2>/dev/null | head -30 || true
          echo "[diag] (.ninja_log contents -- ignored when USE_NINJA=0)"
          find build -name '.ninja_log' -exec head -10 {} +  || true
          echo "[diag] earliest source mtime:"
          find . -name '*.cu' -o -name '*.cpp' 2>/dev/null | head -1 | xargs -I{} stat -c '%y %n' {} || true
          echo "[diag] sample .o mtime (should be newer than source mtime):"
          find build -name '*.o' | head -1 | xargs -I{} stat -c '%y %n' {} || true
        fi
        if [ "${{ inputs.shard-count }}" != "0" ] \
           && [ "${{ inputs.link-only }}" != "true" ]; then
          # ANY compile shard can fail the shard-stage link. This was gated on
          # shard-filter=source until 2026-08-26 on the assumption that "seat
          # shards never hit this -- every TU still emits an object, an empty
          # one when out-of-slice". That is wrong: an EMPTY object still leaves
          # the symbol undefined, so a dispatcher TU that survives in every
          # shard still references kernels this shard stubbed. spconv cu13.0
          # proved it -- all 10 shards died on "undefined reference to
          # cumm::conv::main::Volta_...::conv_kernel", every ARM and Linux cell.
          #
          # A source-partition shard DELETES every autogen TU outside its slice.
          # Any dispatcher TU that is NOT autogen survives in all N shards and is
          # left calling kernels this shard never built, so the final link
          # CANNOT succeed inside a shard -- natten's src/fmha.cu against the
          # autogen fmha_* kernels, "undefined reference to
          # natten::cuda::fmha::fmha_32x128x32_sm70_float32", every ARM/Linux
          # cell, 2026-08-25. It does not need to succeed: the shard's
          # deliverable is build/**/*.o, which the link-only job gathers from
          # all N shards and links once. (`seat` shards never hit this -- every
          # TU still emits an object, an empty one when out-of-slice.)
          #
          # Tolerating the link failure must NOT tolerate a compile failure, so
          # the exit is gated: the log must show undefined references and must
          # NOT show a compiler diagnostic on a source file.
          set +e
          python -m pip wheel . --no-build-isolation --no-deps -v -w dist 2>&1 \
            | tee "$RUNNER_TEMP/shard_build.log"
          rc=${PIPESTATUS[0]}
          set -e
          NOBJ=$(find build -name '*.o' -size +1c 2>/dev/null | wc -l)
          echo "shard ${{ inputs.shard-index }}/${{ inputs.shard-count }}: pip wheel exit=$rc, $NOBJ non-empty object(s)"
          if [ "$rc" -ne 0 ]; then
            if [ "$NOBJ" -eq 0 ]; then
              echo "::error::compile-shard produced no objects -- a real compile failure, not the expected shard link failure"
              exit 1
            fi
            if ! grep -q "undefined reference to" "$RUNNER_TEMP/shard_build.log"; then
              echo "::error::compile-shard failed without undefined references -- not the expected shard link failure"
              exit 1
            fi
            if grep -qE '\.(cu|cpp|cc|cuh|h|hpp)[:(][0-9]+[):].*\b(error|fatal error)\b' "$RUNNER_TEMP/shard_build.log"; then
              echo "::error::compile-shard hit a compiler diagnostic -- refusing to pass it off as the expected link failure"
              exit 1
            fi
            echo "::notice::shard ${{ inputs.shard-index }}/${{ inputs.shard-count }} link failed as designed (shard_filter=source); $NOBJ objects captured for the link job"
          fi
        else
          python -m pip wheel . --no-build-isolation --no-deps -v -w dist
        fi


    - name: Swap usage signal (Linux)
      # The parachute deployed = the compile was over-committed. Surface it
      # as a workflow warning annotation so it is visible on the run page,
      # not buried in 3h of resmon lines. The fix is a lower max_jobs.
      if: always() && inputs.platform == 'linux'
      shell: bash
      run: |
        HW="$RUNNER_TEMP/cuw_swap_highwater"
        used=$(cat "$HW" 2>/dev/null || echo 0)
        memlow=$(cat "$RUNNER_TEMP/cuw_mem_lowwater" 2>/dev/null || echo 999)
        CELL="${{ inputs.package }} py${{ inputs.python-version }} cu${{ inputs.cuda-short }} torch${{ inputs.pytorch-version }}"
        if awk -v u="$used" 'BEGIN{exit !(u > 0.1)}'; then
          MJ="${{ inputs.jobs }}"; NT="${{ inputs.nvcc-threads }}"
          if [ "$MJ" = "1" ] && [ "$NT" = "1" ]; then
            # Already at the floor -- swap here is the parachute doing its
            # one legitimate job. Warn, don't fail.
            echo "::warning title=Compile dipped into swap at minimum settings::$CELL: peak swap ${used}GB with max_jobs=1, nvcc_threads=1. Nothing left to trim -- this package is simply at the runner's memory ceiling."
          elif awk -v u="$used" -v m="$memlow" 'BEGIN{exit !(u > 1.0 && m < 2.0)}'; then
            # Real over-commit: the parachute deployed hard AND free memory
            # actually bottomed out. (Sub-threshold swap with plenty of RAM
            # free is the kernel paging out idle pages -- a flake, not a
            # signal: cumesh linux cu12.8 failed a green build on 0.30GB of
            # swap while 10GB+ sat free, 2026-08-22.)
            echo "::error title=Compile swapped -- build rejected::$CELL: peak swap ${used}GB, MemAvailable low-water ${memlow}GB, max_jobs='${MJ:-default}' nvcc_threads='${NT}'. A swapping compile under memory pressure is over-committed and its timings are garbage; lower max_jobs (or nvcc_threads) for this package."
            exit 1
          else
            echo "::warning title=Swap touched without memory pressure::$CELL: peak swap ${used}GB but MemAvailable never fell below ${memlow}GB -- background page-out, not over-commit. Passing."
          fi
        else
          echo "swap untouched (peak ${used}GB)"
        fi

    - name: Repair wheel (Linux)
      # Skip when we're in compile-shard mode (we threw away the partial wheel
      # mid-chain mode (the timeout fired, done='false', no wheel produced
      # this iteration). Runs in full or link-only mode and in the FINAL
      if: inputs.platform == 'linux' && (inputs.shard-count == '0' || inputs.link-only == 'true')
      shell: bash
      run: |
        python -m pip install auditwheel patchelf
        # Hosted x86 runners are ubuntu-22.04 (glibc 2.35); ARM runners are
        # ubuntu-24.04 (glibc 2.39). The plat is the runner's honest floor --
        # auditwheel verifies the binary against it either way.
        # The plat is POLICY: it tracks PyTorch's manylinux baseline
        # (AlmaLinux 8 containers => glibc 2.28), not the runner's floor.
        if [ "$(uname -m)" = "aarch64" ]; then
          AUDITWHEEL_PLAT="manylinux_2_28_aarch64"
        else
          AUDITWHEEL_PLAT="manylinux_2_28_x86_64"
        fi
        BUILD_DIR="source"
        if [ -n "${{ inputs.build-subdir }}" ]; then
          BUILD_DIR="source/${{ inputs.build-subdir }}"
        fi
        # Add CUDA toolkit libs so auditwheel can find and bundle them (e.g. libnvrtc-builtins.so)
        export LD_LIBRARY_PATH=/usr/local/cuda-${{ inputs.cuda-version }}/lib64:${LD_LIBRARY_PATH:-}
        cd $BUILD_DIR/dist
        for whl in *.whl; do
          # Skip pure Python wheels
          if [[ "$whl" == *"-py3-none-any.whl" ]]; then
            continue
          fi
          # Bundle external shared libs into the wheel. See CW-ADR-0009.
          #
          # auditwheel fnmatches these against the SONAME, not the filename.
          # NVIDIA versions its libraries (libcudart.so.12); PyTorch does not
          # (libtorch.so) -- which is why the torch patterns below work bare and
          # the CUDA one needs a glob.
          #
          # An excluded library gets NO rpath, so it must already be resident
          # when the extension is dlopen'd. Only exclude libraries torch loads
          # eagerly at `import torch`. Do NOT add excludes "for safety": a
          # missing exclude costs megabytes, a wrong one costs a broken import.
          # The assertion below catches anything unexpected instead.
          # cublas/cublasLt (llama_cpp_python's libggml-cuda DT_NEEDs them):
          # vendoring would graft ~850MB of cuBLAS into the wheel; torch
          # preloads both at import, so DT_NEEDED resolves against the
          # already-loaded SONAME -- same contract as libcudart.
          # libggml*/libllama*/libmtmd*: llama_cpp_python SHIPS these
          # side-by-side in llama_cpp/lib/ with $ORIGIN rpaths; auditwheel
          # can't resolve intra-wheel non-standard dirs ("required library
          # libggml-base.so.0 could not be located") and grafting would
          # duplicate them.
          # libcudart is excluded ONLY for torch-linked packages. `import torch`
          # loads cudart from site-packages/nvidia/ before any of our extensions
          # are imported, so DT_NEEDED resolves against the already-loaded
          # SONAME and vendoring would duplicate it. A torch-FREE package has no
          # such preloader: cumm (links_torch: false) shipped DT_NEEDED
          # libcudart.so.13 with nothing providing it, and could not dlopen on
          # any box without a system CUDA toolkit (2026-08-25). For those, let
          # auditwheel vendor it. verify_wheel's TORCH_PROVIDED check enforces
          # the same split from the other side.
          CUDART_EXCLUDE="--exclude libcudart.so*"
          # libgomp rides the same links_torch split as libcudart: torch ships
          # torch/lib/libgomp.so.1 and loads it at `import torch`, so excluding
          # it is right for torch-linked packages and wrong for torch-free ones
          # (it is in no manylinux lib_whitelist, so nothing else guarantees it).
          GOMP_EXCLUDE="--exclude libgomp.so.1"
          LT=$(python -c 'import sys,os; sys.path.insert(0, os.environ["GITHUB_WORKSPACE"]+"/scripts"); from package_loader import iter_packages; print(next(("false" for _f,c in iter_packages() if c.get("name")==sys.argv[1] and c.get("links_torch") is False), "true"))' "${{ inputs.package }}" 2>/dev/null || echo "")
          if [ "$LT" = "false" ]; then
            CUDART_EXCLUDE=""
            GOMP_EXCLUDE=""
            echo "torch-free package: NOT excluding libcudart/libgomp -- auditwheel will vendor them"
          elif [ -z "$LT" ]; then
            echo "::warning::could not resolve links_torch for ${{ inputs.package }}; keeping the libcudart exclude"
          fi
          # --strip: `strip -s` over the vendored libs AND our own extensions
          # (auditwheel/repair.py:133-136). Safe because .nv_fatbin is
          # SHF_ALLOC and strip only discards non-allocated sections -- verified
          # rather than assumed, on the real pytorch3d _C.so: 188MB -> 37MB with
          # SASS {75,80,86,90,100,120} and PTX {90,120} unchanged and the
          # .nv_fatbin section byte-identical (same sha256).
          #
          # The gate is likewise strip-invariant by construction: C4 reads
          # DT_NEEDED/RPATH from .dynamic, C5 proves torch linkage from .dynsym
          # undefined symbols (which MUST be dynamic or the loader could not
          # resolve them), C6 reads .gnu.version_r, C7 reads .nv_fatbin. All
          # allocated. Checked across all 88 binaries in the 24 local wheels:
          # zero differences in any C4/C5/C6/C7 input.
          #
          # Saves 741MB of 1360MB uncompressed (54.5%) and ~55% compressed --
          # DWARF is verbose AND deflate-hostile, so download savings track the
          # on-disk ones. Note it is ~99% a DWARF removal: .symtab+.strtab are
          # only 9.5MB of 1360MB, and .dynsym survives, so a segfault backtrace
          # still resolves exported frames.
          #
          # It buys nothing on the vendored side -- NVIDIA ships libcublas,
          # libcufft, libnvrtc and libcudart pre-stripped (dwarf=0 symtab=0).
          # Every byte saved is our own extensions, where the DWARF is an
          # unintended consequence of setuptools defaulting to -g.
          if auditwheel repair "$whl" \
            --plat "$AUDITWHEEL_PLAT" \
            -w repaired/ \
            --strip \
            --exclude libcuda.so \
            --exclude libcuda.so.1 \
            $CUDART_EXCLUDE \
            --exclude libtorch.so \
            --exclude libtorch_cpu.so \
            --exclude libtorch_cuda.so \
            --exclude libtorch_cuda_linalg.so \
            --exclude libtorch_python.so \
            --exclude libcaffe2_nvrtc.so \
            --exclude libc10.so \
            --exclude libc10_cuda.so \
            --exclude 'libcublas.so*' \
            --exclude 'libcublasLt.so*' \
            --exclude 'libggml*.so*' \
            --exclude 'libllama*.so*' \
            --exclude 'libmtmd*.so*' \
            $GOMP_EXCLUDE; then
            rm "$whl"
          else
            echo "::error::auditwheel repair failed for $whl"
            exit 1
          fi
        done

        # Assert nothing unexpected was vendored (CW-ADR-0009).
        # libnvrtc/libnvrtc-builtins are deliberate: cumm DT_NEEDEDs them for
        # runtime JIT, and torch only preloads NVRTC when torch itself came from
        # the pip nvidia-* wheels. Everything else is a leak -- most likely a
        # package that started linking a CUDA math library, where the transitive
        # closure runs to hundreds of MB.
        for whl in repaired/*.whl; do
          [ -e "$whl" ] || continue
          bundled=$(unzip -Z1 "$whl" 2>/dev/null \
            | grep -oE '[^/]+\.libs/lib[^/]+\.so[^/]*$' \
            | sed -E 's#.*/##; s/-[0-9a-f]{8}\.so.*//; s/\.so.*//' \
            | sort -u || true)
          # The allowlist rides the SAME links_torch switch as the excludes
          # above, and it has to -- otherwise the two halves of this step
          # contradict each other. For a torch-free package the excludes are
          # deliberately cleared so auditwheel VENDORS libcudart/libgomp
          # (nothing preloads them without `import torch`); this assertion then
          # saw exactly that and killed the build with "vendored unexpected
          # libraries: libcudart". The allowlist was imported at d897f4b
          # (2026-08-20); the conditional exclude landed at 5e8736b five days
          # later and did not update it. Net effect until 2026-08-26: every
          # torch-free package was either shipping a wheel that cannot dlopen
          # (all 17 published cumm assets DT_NEEDED libcudart.so.13 with only
          # libnvrtc* in cumm.libs/) or, after the fix, failing to build at all.
          ALLOWED='^(libnvrtc|libnvrtc-builtins)$'
          if [ "$LT" = "false" ]; then
            ALLOWED='^(libnvrtc|libnvrtc-builtins|libcudart|libgomp)$'
            echo "torch-free package: also allowing vendored libcudart/libgomp"
          fi
          unexpected=$(echo "$bundled" \
            | grep -vE "$ALLOWED" | grep -v '^$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::$whl vendored unexpected libraries:"
            echo "$unexpected" | sed 's/^/  /'
            echo "See CW-ADR-0009. If this library is genuinely required at"
            echo "runtime, record it there; if torch loads it eagerly, add an"
            echo "exclude. Do not silence this."
            exit 1
          fi
        done
        if [ -d repaired ] && ls repaired/*.whl 1>/dev/null 2>&1; then
          mv repaired/*.whl .
          rm -rf repaired/
        fi

    - name: Allow unresolved symbols at shard stage (Windows compile-shard mode)
      # A shard's .pyd link only has this shard's objects; Linux ld -shared
      # tolerates the missing symbols, MSVC's link.exe refuses. link.exe
      # reads extra options from the LINK env var regardless of caller, so
      # /FORCE:UNRESOLVED here covers every package generically -- the
      # shard's .pyd is garbage by design and is discarded; only the .obj
      # tarball ships. NOT set in link-only mode, where all objects are
      # present and a real unresolved symbol must fail the build.
      if: inputs.platform == 'windows' && inputs.shard-count != '0' && inputs.link-only != 'true'
      shell: bash
      run: echo "LINK=/FORCE:UNRESOLVED" >> $GITHUB_ENV

    - name: Setup sccache transport (Windows source-filter shard/link)
      # The Linux shard handoff is a content-addressed compiler cache; the
      # Windows object-tarball + mtime path CANNOT work for cmake packages
      # (the link job re-runs configure, regenerating files newer than any
      # restored .o -- natten's link rebuilt everything serially for hours).
      # sccache is the Windows ccache: cmake >= 3.17 picks the launcher up
      # from CMAKE_<LANG>_COMPILER_LAUNCHER env vars, no build changes.
      if: inputs.platform == 'windows' && inputs.shard-count != '0' && inputs.shard-filter == 'source'
      shell: bash
      run: |
        if ! command -v sccache >/dev/null 2>&1; then
          choco install sccache -y --no-progress >/dev/null
        fi
        SC="$RUNNER_TEMP/sccache"
        mkdir -p "$SC"
        {
          echo "SCCACHE_DIR=$SC"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache"
        } >> $GITHUB_ENV
        echo "sccache transport armed ($(sccache --version 2>/dev/null | head -1))"

    - name: Restore shard sccache (Windows source-filter link)
      if: inputs.platform == 'windows' && inputs.link-only == 'true' && inputs.shard-filter == 'source'
      shell: bash
      run: |
        SA="$(cd "$GITHUB_WORKSPACE/shard-artifacts" 2>/dev/null && pwd || true)"
        # RUNNER_TEMP is a WINDOWS path (D:\a\_temp). Handing it to Git-bash
        # tar verbatim makes tar read the drive colon as a remote host:
        #   tar: D\:\a\\_temp/sccache: Cannot open: No such file or directory
        # ...and the loop then extracts nothing, so the link job died with
        # "no shard sccache artifacts found" and blamed the shard jobs, which
        # had all succeeded (natten Windows, 2026-08-25 -- 20/20 shards green).
        # The objects-restore step already resolves to a POSIX path first and
        # the sccache PACKAGE step already passes --force-local; this step did
        # neither. Do both.
        SC="$(cd "$RUNNER_TEMP" && pwd)/sccache"
        mkdir -p "$SC"
        found=0
        for tarball in "$SA"/*/sccache.tar.gz; do
          [ -f "$tarball" ] || continue
          found=$((found+1))
          tar --force-local -xzf "$tarball" -C "$SC"
        done
        if [ "$found" = "0" ]; then
          echo "::error::no shard sccache artifacts found -- did the shard jobs succeed?"
          exit 1
        fi
        ENTRIES=$(find "$SC" -type f | wc -l)
        echo "merged $found sccache shard(s), $ENTRIES cache entries: $(du -sh "$SC" | cut -f1)"
        if [ "$ENTRIES" -eq 0 ]; then
          echo "::error::sccache tarballs extracted to ZERO entries -- the merge silently produced nothing (path mangling?). The link job would recompile everything."
          exit 1
        fi

    - name: Setup MSVC (Windows)
      # Host-compiler pairing, Windows edition (mirror of the Linux
      # gcc-toolset rule): the runner image rolled to MSVC 14.4x
      # (VS 17.10+), whose STL breaks CUDA 12.4's CUB headers
      # ("no operator >=" in dispatch_histogram.cuh -- the legacy farm
      # built these very cells on an older image). Pin the VS2019-era
      # 14.29 toolset for 12.4 ONLY: nvcc 12.6 handles the default
      # toolset (proven by pre-pin cumm/cumesh cu126 wheels), and
      # torch >= 2.12 headers REQUIRE it (TypeList.h dies under
      # 14.29's STL -- cc_torch cu126 torch2.12/2.13, 2026-08-22).
      # (Lexical compare is safe here: "12.4" < "12.6" <= every 13.x.)
      if: inputs.platform == 'windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: ${{ inputs.cuda-version < '12.6' && '14.29' || '' }}
        # SDK pinned to the 14.29-era kit for coherence. (The cudafe++
        # 0xC0000409 crash once blamed on SDK 26100 was actually cumesh's
        # own c++17->c++20 patch rewrite -- root-caused 2026-08-23, panel
        # verdict: 14.29 rejects -std=c++20, nvcc demotes cudafe++ to
        # C++17 but still forwards /std:c++20 to the host side.)
        sdk: ${{ inputs.cuda-version < '12.6' && '10.0.22621.0' || '' }}

    - name: Build wheel (Windows)
      id: build_windows
      if: inputs.platform == 'windows'
      shell: powershell
      run: |
        # ── Background resource monitor (Windows) ────────────────────────────
        # There was NONE on this lane. The Linux build has printed a memory,
        # swap, CPU and top-processes line every 120s for months, and has a gate
        # that fails an over-committed compile; Windows had neither, so a
        # Windows build that died of memory pressure looked like an unexplained
        # compiler crash. Same cadence and same fields as the Linux resmon so
        # the two logs read alike.
        #
        # Run as a child process with -NoNewWindow so it inherits this step's
        # stdout and the lines interleave into the live log (Start-Job would
        # buffer them until Receive-Job, which never gets called while the build
        # is blocking). GH Actions kills the process tree at step end; the
        # explicit Stop-Process below is belt and braces.
        #
        # Windows terms: "Available MBytes" is the true analogue of Linux's
        # MemAvailable. The pagefile is the swap analogue -- committed bytes
        # above physical RAM means the same thing a swapped Linux compile does.
        $monScript = @'
        $prevIdle = 0; $prevTot = 0
        while ($true) {
          $os   = Get-CimInstance Win32_OperatingSystem
          $totGB   = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
          $availGB = [math]::Round($os.FreePhysicalMemory     / 1MB, 1)
          $usedGB  = [math]::Round($totGB - $availGB, 1)
          # Pagefile in use -- the swap analogue.
          $pf = Get-CimInstance Win32_PageFileUsage -ErrorAction SilentlyContinue
          $pfUsed = if ($pf) { [math]::Round(($pf | Measure-Object CurrentUsage -Sum).Sum / 1KB, 2) } else { 0 }
          $pfTot  = if ($pf) { [math]::Round(($pf | Measure-Object AllocatedBaseSize -Sum).Sum / 1KB, 1) } else { 0 }
          $cpu = try { [math]::Round((Get-CimInstance Win32_Processor |
                   Measure-Object LoadPercentage -Average).Average, 0) } catch { '--' }
          $procs = Get-Process -ErrorAction SilentlyContinue
          $nthr  = ($procs | Measure-Object { $_.Threads.Count } -Sum).Sum
          $top3  = ($procs | Sort-Object WorkingSet64 -Descending | Select-Object -First 3 |
                    ForEach-Object { '{0}({1:N2}GB)' -f $_.ProcessName, ($_.WorkingSet64 / 1GB) }) -join ' '
          $ts = (Get-Date).ToUniversalTime().ToString('HH:mm:ssZ')
          Write-Host "[resmon $ts] mem: $usedGB/$totGB`GB used ($availGB avail) | pagefile: $pfUsed/$pfTot`GB used | cpu: $cpu% ($nthr thr) | top3: $top3"
          # High-water files, read by the "Memory pressure signal (Windows)"
          # step, mirroring the Linux swap gate.
          $hw = "$env:RUNNER_TEMP\cuw_win_pf_highwater"
          $lw = "$env:RUNNER_TEMP\cuw_win_mem_lowwater"
          if (-not (Test-Path $hw) -or [double](Get-Content $hw) -lt $pfUsed) { $pfUsed | Set-Content $hw }
          if (-not (Test-Path $lw) -or [double](Get-Content $lw) -gt $availGB) { $availGB | Set-Content $lw }
          Start-Sleep -Seconds 120
        }
        '@
        $monPath = "$env:RUNNER_TEMP\cuw_resmon.ps1"
        $monScript | Set-Content -Path $monPath -Encoding UTF8
        "999" | Set-Content "$env:RUNNER_TEMP\cuw_win_mem_lowwater"
        "0"   | Set-Content "$env:RUNNER_TEMP\cuw_win_pf_highwater"
        $mon = Start-Process -FilePath "powershell" `
                 -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",$monPath `
                 -PassThru -NoNewWindow
        $mon.Id | Set-Content "$env:RUNNER_TEMP\cuw_resmon.pid"
        Write-Host "resmon started (pid $($mon.Id)), sampling every 120s"

        # Ensure ninja is in PATH (pip Scripts directory)
        $pythonPath = (python -c "import sys; print(sys.prefix)")
        $scriptsPath = "$pythonPath\Scripts"
        $env:PATH = "$scriptsPath;$env:PATH"

        # CUDA 13.2's bundled CCCL headers hard-#error under MSVC's traditional
        # preprocessor; they require the standards-conforming one. cl.exe reads
        # extra flags from the CL env var -- including when nvcc invokes it --
        # and torch's cpp_extension does not pass the flag itself. Scoped to
        # 13.2+ so working 12.x/13.0 builds are untouched.
        $cudaParts = "${{ inputs.cuda-version }}".Split('.')
        if ([int]$cudaParts[0] -gt 13 -or ([int]$cudaParts[0] -eq 13 -and [int]$cudaParts[1] -ge 2)) {
          $env:CL = "/Zc:preprocessor $env:CL".Trim()
          Write-Host "CUDA >= 13.2: CL=$env:CL (conforming preprocessor for CCCL)"
        }

        # Verify ninja is available
        Write-Host "Checking ninja..."
        ninja --version

        $buildDir = "source"
        if ("${{ inputs.build-subdir }}" -ne "") {
          $buildDir = "source/${{ inputs.build-subdir }}"
        }
        cd $buildDir
        $env:TORCH_CUDA_ARCH_LIST = "${{ inputs.arch-list }}"
        if ("${{ inputs.jobs }}" -ne "") {
          $env:MAX_JOBS = "${{ inputs.jobs }}"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "${{ inputs.jobs }}"
        }
        $env:DISTUTILS_USE_SDK = "1"
        # torch < 2.7's cpp_extension omits /std:c++17 from its MSVC flags
        # (added upstream in 2.7), and MSVC defaults to C++14, so any
        # package that doesn't pass the flag itself dies with c10's
        # "You need C++17 to compile PyTorch" (drtk/dpvo cu124-126 old-torch
        # cells, 2026-08-23). The CL env var prepends flags to every
        # cl.exe invocation -- including nvcc's host passes -- and
        # command-line flags still win, so packages that set their own
        # /std: are unaffected.
        # CL is PREPENDED to every cl.exe command line, so anything the
        # package or torch puts on the command line still wins -- this is a
        # floor, not an override. Applied unconditionally because MSVC
        # defaults to C++14 whenever nothing supplies /std:, and which torch
        # versions emit one is not a clean boundary: torch < 2.7 emits
        # nothing, and torch 2.8 was ALSO found not to for the PyG packages
        # (C2429 "nested-namespace-definition requires /std:c++17" on
        # torch_cluster/scatter/spline_conv cu12.8 Windows, 2026-08-24).
        # The floor must TRACK torch, never sit below what torch's own headers
        # require. torch 2.12 flipped cpp_extension's MSVC default to
        # /std:c++20 and torch 2.13's headers HARD-REQUIRE it -- C7555
        # (designated initializers, c10/util/StringUtil.h:169) and C7582
        # (bit-field NSDMIs, c10/core/AutogradState.h:89). A fixed c++17 floor
        # was assumed harmless because "torch >= 2.12 puts /std:c++20 on the
        # command line and overrides it" -- but that is not universally true:
        # mmcv cu12.6 torch2.13.0 Windows died on exactly those two errors with
        # the c++17 floor in place (2026-08-25), because not every TU in its
        # build goes through cpp_extension's flag path.
        # Still a FLOOR: CL is prepended, so a package that puts its own /std:
        # on the command line continues to win either way.
        $torchMM = [version]("${{ inputs.pytorch-version }}".Split('.')[0..1] -join '.')
        $stdFloor = if ($torchMM -ge [version]"2.12") { "/std:c++20" } else { "/std:c++17" }
        $env:CL = "$stdFloor $($env:CL)".Trim()
        Write-Host "MSVC C++ floor: torch $torchMM -> $stdFloor (CL=$($env:CL))"
        # Force CUDA build even without a GPU (torch.cuda.is_available() is False on CI)
        $env:FORCE_CUDA = "1"
        # For cumm/spconv: set CUDA version for prebuilt mode
        $env:CUMM_CUDA_VERSION = "${{ inputs.cuda-version }}"
        $env:CUMM_CUDA_ARCH_LIST = "${{ inputs.arch-list }}"
        # For cumm/spconv: disable JIT to force ahead-of-time CUDA compilation
        $env:CUMM_DISABLE_JIT = "1"
        $env:SPCONV_DISABLE_JIT = "1"
        # NVCC_THREADS pinned to 1 -- see the Linux block: per-arch peaks of
        # one TU land together; ninja-level parallelism spreads them out.
        if (-not $env:NVCC_THREADS) { $env:NVCC_THREADS = "${{ inputs.nvcc-threads }}" }
        # Per-package nvcc flags (e.g. warning suppression)
        if ("${{ inputs.nvcc-flags }}" -ne "") {
          $env:NVCC_APPEND_FLAGS = "${{ inputs.nvcc-flags }}"
        }
        # Trailing --threads wins over setup.py hardcodes (see Linux block).
        $env:NVCC_APPEND_FLAGS = "$($env:NVCC_APPEND_FLAGS) --threads=${{ inputs.nvcc-threads }}".Trim()
        # Shard env vars for source-filter packages (shard-filter=source,
        # e.g. NATTEN): their patch partitions the source list itself; see
        # the equivalent Linux block. Never set alongside the CUDAExtension
        # monkeypatch -- two partitions intersect and defeat sharding.
        if ("${{ inputs.shard-count }}" -ne "0" -and "${{ inputs.link-only }}" -ne "true" -and "${{ inputs.shard-filter }}" -eq "source") {
          $env:CUDA_WHEELS_SHARD_INDEX = "${{ inputs.shard-index }}"
          $env:CUDA_WHEELS_SHARD_COUNT = "${{ inputs.shard-count }}"
          Write-Host "[compile-shard] CUDA_WHEELS_SHARD_INDEX=$($env:CUDA_WHEELS_SHARD_INDEX) of $($env:CUDA_WHEELS_SHARD_COUNT)"
        }
        # Link-only mode: same USE_NINJA=0 fallback that the Linux step uses
        # (torch 2.8's BuildExtension does respect the kwargs we patched in,
        # but defensively set this too in case some code path checks env).
        if ("${{ inputs.link-only }}" -eq "true" -and "${{ inputs.shard-filter }}" -ne "source") {
          $env:USE_NINJA = "0"
          $env:CUW_NOOP_COUNTER = "$env:RUNNER_TEMP\cuw_noop_witness"
          Remove-Item -Force $env:CUW_NOOP_COUNTER -ErrorAction SilentlyContinue
          Write-Host "[link-only] noop witness -> $($env:CUW_NOOP_COUNTER)"
        }
        python -m pip wheel . --no-build-isolation --no-deps -v -w dist
        # The compile no-op MUST have fired. Until 2026-08-25 it never did on
        # Windows -- the patch landed on CCompiler.compile, which MSVCCompiler
        # overrides -- so every "link" job silently recompiled all N TUs
        # serially and died at the runner cap. Never let that be silent again.
        if ("${{ inputs.link-only }}" -eq "true" -and "${{ inputs.shard-filter }}" -ne "source") {
          if (-not (Test-Path $env:CUW_NOOP_COUNTER)) {
            Write-Host "::error::link-only: the compile no-op NEVER FIRED. The monkeypatch is not reaching this platform's compiler class -- this job recompiled instead of linking."
            exit 1
          }
          $w = Get-Content $env:CUW_NOOP_COUNTER
          Write-Host "[link-only] compile no-op fired $($w.Count) time(s): $($w -join '; ')"
        }
    - name: Memory pressure signal (Windows)
      # The Windows counterpart of the Linux swap gate. Reports rather than
      # fails: the Linux thresholds were tuned against months of Linux runs and
      # there is no comparable history here yet, so this starts as an
      # annotation. Promote it to a failure once the numbers are known -- and
      # note the Linux gate needed BOTH conditions (swap used AND available
      # memory bottomed out) because swap alone rejected a healthy build with
      # 10GB free.
      if: always() && inputs.platform == 'windows'
      shell: powershell
      run: |
        # Kill the monitor BY ITS RECORDED PID. Never by name: this step is
        # itself powershell, so Stop-Process -Name powershell would terminate
        # the process running it.
        $pidFile = "$env:RUNNER_TEMP\cuw_resmon.pid"
        if (Test-Path $pidFile) {
          Stop-Process -Id ([int](Get-Content $pidFile)) -Force -ErrorAction SilentlyContinue
        }
        $lw = "$env:RUNNER_TEMP\cuw_win_mem_lowwater"
        $hw = "$env:RUNNER_TEMP\cuw_win_pf_highwater"
        $memlow = if (Test-Path $lw) { [double](Get-Content $lw) } else { 999 }
        $pfpeak = if (Test-Path $hw) { [double](Get-Content $hw) } else { 0 }
        $cell = "${{ inputs.package }} py${{ inputs.python-version }} cu${{ inputs.cuda-version }} torch${{ inputs.pytorch-version }} windows"
        Write-Host "[windows memory] available low-water ${memlow}GB, pagefile peak ${pfpeak}GB, max_jobs='${{ inputs.jobs }}' nvcc_threads='${{ inputs.nvcc-threads }}'"
        if ($memlow -lt 2.0) {
          Write-Host "::warning title=Windows build ran low on memory::${cell}: available memory fell to ${memlow}GB (pagefile peak ${pfpeak}GB). A compile this close to the ceiling is one template instantiation away from dying with an unexplained compiler crash -- lower max_jobs for this package."
        } elseif ($pfpeak -gt 1.0) {
          Write-Host "::warning title=Windows build touched the pagefile::${cell}: pagefile peak ${pfpeak}GB while available memory stayed at ${memlow}GB. Not over-committed, but worth watching."
        }

    - name: Assert sccache hit rate (Windows source-filter link)
      # The Windows sccache lane (natten, shard_filter: source) had NO hit-rate
      # assert at all -- the Linux one below is gated `platform == 'linux'`. So
      # the exact failure the Linux assert exists to catch, a link job silently
      # recompiling everything and dying at the runner cap looking "slow", was
      # undetectable on the one platform where it is most expensive. Same class
      # of blind spot as the compile no-op that never fired here (2026-08-25).
      if: inputs.platform == 'windows' && inputs.link-only == 'true' && inputs.shard-filter == 'source'
      shell: bash
      run: |
        sccache --show-stats || true
        STATS=$(sccache --show-stats 2>/dev/null || true)
        HITS=$(echo "$STATS" | awk -F'[[:space:]][[:space:]]+' '/^Cache hits/ {gsub(/[^0-9]/,"",$2); print $2; exit}')
        MISS=$(echo "$STATS" | awk -F'[[:space:]][[:space:]]+' '/^Cache misses/ {gsub(/[^0-9]/,"",$2); print $2; exit}')
        HITS=${HITS:-0}; MISS=${MISS:-0}
        TOTAL=$((HITS+MISS))
        echo "sccache: $HITS hits / $MISS misses"
        if [ "$TOTAL" -eq 0 ]; then
          echo "::error::link-job saw ZERO sccache lookups -- the shard cache handoff did not happen at all. This job did not link shards."
          exit 1
        fi
        if [ "$MISS" -gt 0 ]; then
          echo "::error::link-job had $MISS sccache miss(es) of $TOTAL. Every miss is a full TU recompile; the shard caches did not transfer cleanly."
          exit 1
        fi

    - name: Assert cache hit rate (Linux link-only mode)
      # The failure mode of compiler caches is cliff-edged: one bad flag and
      # the hit rate silently drops to 0, the link job recompiles everything
      # and dies at the cap looking "slow" rather than "broken". Make it
      # loud instead.
      if: inputs.platform == 'linux' && inputs.link-only == 'true'
      shell: bash
      run: |
        ccache -s || true
        STATS=$(ccache --print-stats 2>/dev/null || true)
        HITS=$(echo "$STATS" | awk -F'\t' '$1 ~ /^(direct_cache_hit|preprocessed_cache_hit)$/ {n+=$2} END{print n+0}')
        MISSES=$(echo "$STATS" | awk -F'\t' '$1 == "cache_miss" {n+=$2} END{print n+0}')
        TOTAL=$((HITS+MISSES))
        echo "cache: $HITS hits / $MISSES misses"
        # ZERO tolerance, not 90%. A single miss is a full TU recompile -- on
        # flash_attn ARM that is ~470s -- so a "94.4% hit rate" passed this
        # gate while costing 31 minutes and hiding an arch-collision bug
        # (2026-08-25). A ratio threshold cannot distinguish "one nondeterministic
        # TU" from "four shards arrived from the wrong architecture"; a count can.
        # TOTAL==0 is NOT a pass: it means ccache was never consulted, i.e. the
        # handoff did not happen at all. The old check was vacuous there.
        if [ "$TOTAL" -eq 0 ]; then
          echo "::error::link-job saw ZERO ccache lookups -- the shard cache handoff did not happen at all (nothing was restored, or ccache is not on PATH). This job did not link shards."
          exit 1
        fi
        if [ "$MISSES" -gt 0 ]; then
          echo "::error::link-job had $MISSES ccache miss(es) out of $TOTAL. Every miss is a full TU recompile. Shard caches did not transfer cleanly -- flag mismatch, path mismatch, wrong-architecture artifacts, or nondeterministic codegen."
          ccache --print-stats 2>/dev/null | grep -iE "miss|hit" || true
          exit 1
        fi
        # Same witness the Windows step asserts: prove the compile no-op fired
        # rather than inferring it from timing.
        if [ -n "${CUW_NOOP_COUNTER:-}" ] && [ -s "$CUW_NOOP_COUNTER" ]; then
          echo "[link-only] compile no-op fired $(wc -l < "$CUW_NOOP_COUNTER") time(s)"
        fi

    - name: Package shard cache (Linux compile-shard mode)
      # The compiler cache IS the shard's product: content-addressed, so the
      # link job unions all shards' caches and replays the full build as
      # cache hits. No object paths, no mtimes.
      if: inputs.platform == 'linux' && inputs.shard-count != '0' && inputs.link-only != 'true'
      shell: bash
      run: |
        ccache -s || true
        FILES=$(find "$RUNNER_TEMP/ccache" -type f | wc -l)
        if [ "$FILES" = "0" ]; then
          echo "::error::shard produced an empty compiler cache -- the wrapper was never invoked (build system bypassed PYTORCH_NVCC/CUDACXX?)"
          exit 1
        fi
        mkdir -p $GITHUB_WORKSPACE/shard-out
        tar -czf $GITHUB_WORKSPACE/shard-out/ccache.tar.gz -C "$RUNNER_TEMP/ccache" .
        ls -lh $GITHUB_WORKSPACE/shard-out/

    - name: Package shard objects (Windows compile-shard mode)
      if: inputs.platform == 'windows' && inputs.shard-count != '0' && inputs.link-only != 'true' && inputs.shard-filter != 'source'
      shell: bash
      run: |
        cd source
        if [ -n "${{ inputs.build-subdir }}" ]; then
          cd "${{ inputs.build-subdir }}"
        fi
        if [ ! -d build ]; then
          echo "::error::no build/ directory after compile -- did setup.py build_ext run?"
          ls -la
          exit 1
        fi
        echo "Object tree this shard produced (first 50):"
        # `|| true` to swallow SIGPIPE under pipefail if find > head -50.
        find build \( -name '*.o' -o -name '*.obj' \) -printf '  %P (%s bytes)\n' 2>/dev/null | head -50 || true
        OBJ_COUNT=$(find build \( -name '*.o' -o -name '*.obj' \) | wc -l)
        echo "Total objects: $OBJ_COUNT"
        if [ "$OBJ_COUNT" = "0" ]; then
          echo "::error::no object files produced by this shard -- shard filter may have dropped everything, or compile failed silently"
          exit 1
        fi
        # Tar the entire build/ tree. Captures both cpp_extension layout
        # (build/temp.<plat>-cpython-<py>/.../*.o) and cmake-style layout
        # (build/natten_cmake/CMakeFiles/natten.dir/.../*.o for NATTEN).
        # The link job extracts at the same relative path and the build
        # system's mtime check finds the .o files in place.
        mkdir -p $GITHUB_WORKSPACE/shard-out
        # --force-local: under Git-bash $GITHUB_WORKSPACE is D:\a\... and GNU
        # tar reads the colon as a remote host ("Cannot write: Broken pipe",
        # all 6 natten shards, wave 2).
        tar --force-local -czf $GITHUB_WORKSPACE/shard-out/objects.tar.gz build/
        ls -lh $GITHUB_WORKSPACE/shard-out/


    - name: Package shard sccache (Windows source-filter compile-shard)
      if: inputs.platform == 'windows' && inputs.shard-count != '0' && inputs.link-only != 'true' && inputs.shard-filter == 'source'
      shell: bash
      run: |
        sccache --stop-server >/dev/null 2>&1 || true
        mkdir -p $GITHUB_WORKSPACE/shard-out
        # Same POSIX normalisation as the restore step: RUNNER_TEMP is a
        # Windows path and bash tools read the drive colon as a host separator.
        # This step happened to work (sccache itself created the dir via the
        # Windows-path SCCACHE_DIR), but relying on that is the same latent bug
        # that broke the restore side.
        SC="$(cd "$RUNNER_TEMP" && pwd)/sccache"
        ENTRIES=$(find "$SC" -type f | wc -l)
        echo "sccache entries this shard: $ENTRIES"
        if [ "$ENTRIES" = "0" ]; then
          echo "::error::empty sccache after compile -- launcher not engaged?"
          exit 1
        fi
        tar --force-local -czf $GITHUB_WORKSPACE/shard-out/sccache.tar.gz -C "$SC" .

    - name: Upload shard artifact (compile-shard mode)
      if: inputs.shard-count != '0' && inputs.link-only != 'true'
      uses: actions/upload-artifact@v4
      with:
        # Naming key must include every dimension that produces different .o
        # output (package, CPU arch, python, cuda, torch). The link job
        # downloads with a `*-of-<shard_count>` glob to gather all shards.
        #
        # runner.arch, NOT inputs.platform: every aarch64 job passes
        # `platform: linux` (it IS a Linux container -- the input drives shell
        # and toolchain paths, not the CPU). So x86_64 and aarch64 shards
        # uploaded under BYTE-IDENTICAL names, and the link job's glob matched
        # all 40 of them. download-artifact then deduplicated by name and took
        # one of each pair ARBITRARILY, so an aarch64 link could receive x86_64
        # objects. Observed 2026-08-25 on flash_attn: 200 "linux" artifacts
        # where 100 were expected, zero linux_aarch64, and ARM link jobs
        # finishing in 7-13min vs 27-29min purely on which half they drew.
        # runner.arch is X64/ARM64 and is exactly the axis that changes the .o.
        name: shard-${{ inputs.package }}-${{ inputs.platform }}-${{ runner.arch }}-py${{ inputs.python-version }}-cu${{ inputs.cuda-short }}-torch${{ inputs.pytorch-version }}-${{ inputs.shard-index }}-of-${{ inputs.shard-count }}
        path: shard-out/*.tar.gz
        retention-days: 1

    - name: Rename wheel with CUDA+PyTorch suffix (Linux)
      # Skip in compile-shard mode -- no wheel was kept. Also skip in
      if: inputs.platform == 'linux' && (inputs.shard-count == '0' || inputs.link-only == 'true')
      id: rename-linux
      shell: bash
      run: |
        BUILD_DIR="source"
        if [ -n "${{ inputs.build-subdir }}" ]; then
          BUILD_DIR="source/${{ inputs.build-subdir }}"
        fi
        cd $BUILD_DIR/dist
        CUDA_SHORT="${{ inputs.cuda-short }}"
        TORCH_MM=$(echo "${{ inputs.pytorch-version }}" | cut -d. -f1,2)
        for f in *.whl; do
          # Skip pure Python wheels (py3-none-any) - they don't have CUDA code
          if [[ "$f" == *"-py3-none-any.whl" ]]; then
            echo "WARNING: Built pure Python wheel $f - CUDA compilation may have failed"
            newname="$f"
          elif [[ "$f" == *"+cu"* ]]; then
            echo "already carries a local tag: $f"
            newname="$f"
          else
            # Anchor on the VERSION segment (name-version-...), not on -cp:
            # abi-agnostic wheels (py3-none / cpXY-abi3) have no -cp pair
            # and the old sed no-op'd, then mv'd a file onto itself.
            newname=$(echo "$f" | sed -E "s/^([A-Za-z0-9_.]+-[0-9][^-]*)-/\1+cu${CUDA_SHORT}torch${TORCH_MM}-/")
            if [ "$newname" != "$f" ]; then mv "$f" "$newname"; fi
          fi
          echo "wheel-path=$BUILD_DIR/dist/$newname" >> $GITHUB_OUTPUT
        done
        mkdir -p $GITHUB_WORKSPACE/dist
        cp *.whl $GITHUB_WORKSPACE/dist/

    - name: Rename wheel with CUDA+PyTorch suffix (Windows)
      # Skip in compile-shard mode -- no wheel was kept. Also skip in
      if: inputs.platform == 'windows' && (inputs.shard-count == '0' || inputs.link-only == 'true')
      id: rename-windows
      shell: powershell
      run: |
        $buildDir = "source"
        if ("${{ inputs.build-subdir }}" -ne "") {
          $buildDir = "source/${{ inputs.build-subdir }}"
        }
        cd "$buildDir\dist"
        $cudaShort = "${{ inputs.cuda-short }}"
        $torchMM = "${{ inputs.pytorch-version }}".Split('.')[0..1] -join '.'
        Get-ChildItem *.whl | ForEach-Object {
          # Skip pure Python wheels (py3-none-any) - they don't have CUDA code
          if ($_.Name -like "*-py3-none-any.whl") {
            Write-Host "WARNING: Built pure Python wheel $($_.Name) - CUDA compilation may have failed"
            $newName = $_.Name
          } elseif ($_.Name -like "*+cu*") {
            Write-Host "already carries a local tag: $($_.Name)"
            $newName = $_.Name
          } else {
            # Anchor on the VERSION segment: abi-agnostic wheels (py3-none)
            # have no -cp pair and the old -cp anchor silently no-op'd.
            $newName = $_.Name -replace '^([A-Za-z0-9_.]+-[0-9][^-]*)-', "`$1+cu${cudaShort}torch${torchMM}-"
            if ($newName -ne $_.Name) { Rename-Item $_.FullName $newName }
          }
          echo "wheel-path=$buildDir/dist/$newName" >> $env:GITHUB_OUTPUT
        }
        New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\dist | Out-Null
        Copy-Item *.whl $env:GITHUB_WORKSPACE\dist\

    - name: Fix wheel METADATA version
      # Skip in compile-shard mode -- no wheel exists yet. Also skip in
      if: (inputs.shard-count == '0' || inputs.link-only == 'true')
      shell: bash
      run: |
        # The wheel filename includes the local version (e.g., +cu130torch29)
        # but the internal METADATA still has the base version from pyproject.toml.
        # Fix the METADATA to match the filename so pip/uv see consistent versions.
        # --package also applies the config's curated requires_dist, if any.
        # --arch-list is RECORDED into METADATA here, not used to decide
        # anything. It is what lets scripts/check_stale.py tell, later, whether
        # a published wheel was built for the arch list the config now resolves
        # to -- the question nothing could answer when a fix landed and the
        # filename-based rebuild check skipped every cell that already had a
        # wheel. (The verify step deliberately does NOT take an arch list; it
        # resolves its own from the YAML.)
        python "$GITHUB_WORKSPACE/.github/actions/build-wheel/patch_wheel_version.py" --package "${{ inputs.package }}" --arch-list "${{ inputs.arch-list }}" "$GITHUB_WORKSPACE/dist"

    - name: Verify wheel (gate before upload)
      # The pre-publication quality gate: filename/cell coherence, metadata
      # integrity, compiled-code census, NEEDED/RPATH + glibc-2.28 audits,
      # links_torch-vs-binary proof, fatbin arch assert, and a subprocess
      # import test against the exact build torch. ALL logic lives in
      # scripts/verify_wheel.py -- non-zero exit fails this step, the upload
      # never runs, and the wheel is not published.
      if: (inputs.shard-count == '0' || inputs.link-only == 'true')
      shell: bash
      # NO --arch-list. The gate resolves it from the package YAML itself.
      # Passing it here meant the gate was told what to expect by the same
      # matrix that drove the build: get the matrix wrong and the build
      # compiles the wrong archs while the gate expects the wrong archs, and it
      # passes green. Now the build reads the YAML to compile and the gate
      # reads the YAML to check, with no copy travelling through CI plumbing
      # between them -- so a mangled arch_list is a hard C7 failure instead of
      # a silent agreement. (verify_wheel keeps --arch-list as an explicit
      # override for running it by hand.)
      run: python "$GITHUB_WORKSPACE/scripts/verify_wheel.py" "$GITHUB_WORKSPACE/dist" --package "${{ inputs.package }}" --cuda "${{ inputs.cuda-version }}" --torch "${{ inputs.pytorch-version }}" --platform "${{ inputs.platform }}"

    - name: Set wheel-path output
      # Empty in compile-shard mode.
      if: (inputs.shard-count == '0' || inputs.link-only == 'true')
      id: rename
      shell: bash
      run: |
        if [ "${{ inputs.platform }}" == "linux" ]; then
          echo "wheel-path=${{ steps.rename-linux.outputs.wheel-path }}" >> $GITHUB_OUTPUT
        else
          echo "wheel-path=${{ steps.rename-windows.outputs.wheel-path }}" >> $GITHUB_OUTPUT
        fi

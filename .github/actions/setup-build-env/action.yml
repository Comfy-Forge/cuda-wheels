name: 'Setup Build Environment'
description: 'Install Python, PyTorch, and build dependencies with caching'

inputs:
  python-version:
    description: 'Python version (e.g., 3.11)'
    required: true
  pytorch-version:
    description: 'PyTorch version (e.g., 2.4.0)'
    required: true
  cuda-short:
    description: 'CUDA short version (e.g., 124)'
    required: true
  platform:
    description: 'Platform (linux or windows)'
    required: true
  extra-deps:
    description: 'Extra pip dependencies'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether uv cache was restored'
    value: ${{ steps.uv-cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python ${{ inputs.python-version }} (hosted toolcache)
      # In the manylinux container the interpreters are pre-baked under
      # /opt/python; setup-python's toolcache builds are glibc-2.34+ and
      # would poison the floor. Container detection: /etc/redhat-release.
      if: inputs.platform == 'windows'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Python ${{ inputs.python-version }} (manylinux /opt/python)
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        if [ -f /etc/redhat-release ]; then
          PYTAG="cp$(echo '${{ inputs.python-version }}' | tr -d .)"
          PYBIN="/opt/python/${PYTAG}-${PYTAG}/bin"
          if [ ! -x "$PYBIN/python" ]; then
            echo "::error::no manylinux interpreter at $PYBIN"; ls /opt/python; exit 1
          fi
          echo "$PYBIN" >> $GITHUB_PATH
          "$PYBIN/python" -V
        else
          # bare runner (legacy fallback): fall back to system python
          python3 -V
        fi

    # ============== LINUX ==============
    - name: Restore uv cache (Linux)
      if: inputs.platform == 'linux'
      id: uv-cache-linux
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/uv
        key: uv-linux-cu${{ inputs.cuda-short }}-torch${{ inputs.pytorch-version }}

    - name: Install dependencies (Linux)
      if: inputs.platform == 'linux'
      shell: bash
      # extra-deps goes through env, NOT ${{ }} interpolation: an expression is
      # spliced into the script as TEXT before bash parses it, so a version
      # specifier like `pccm>=0.4.16` is read as a redirection -- the constraint
      # is silently dropped and a file named `=0.4.16` appears. Parameter
      # expansion happens after redirection parsing, so $EXTRA_DEPS is safe.
      # Deliberately unquoted: the value is a space-separated list and must split.
      env:
        EXTRA_DEPS: ${{ inputs.extra-deps }}
      run: |
        python -m pip install uv
        uv pip install --system --reinstall torch==${{ inputs.pytorch-version }}+cu${{ inputs.cuda-short }} --index-url https://download.pytorch.org/whl/cu${{ inputs.cuda-short }}
        # setuptools>=78: py3.10/3.11 toolcache Pythons ship 65.5.0 and uv leaves
        # an already-present version alone, so Windows cells silently built
        # against it -- 65.5.0 emits RELATIVE -I include dirs and nunchaku's
        # ninja compile then fails with C1083 (2026-08-24). Latent for every
        # Windows package, hence a farm-wide floor rather than extra_deps.
        #
        # <84 added 2026-08-27. setuptools 84.0.0 RENAMED the hook torch relies
        # on: _distutils/compilers/C/msvc.py's compile() now ends in
        # `self.call(args)` where every version through 83.0.0 ended in
        # `self.spawn(args)`. Verified by diffing the two wheels.
        #
        # torch's BuildExtension, on Windows with use_ninja=False, dispatches
        # .cu files to nvcc by monkeypatching self.compiler.spawn
        # (cpp_extension.py win_wrap_single_compile). Under 84 that assignment
        # still SUCCEEDS -- spawn survives as a deprecated shim -- and is then
        # never called. The patch has already nulled extra_postargs, and .cu is
        # already in _cpp_extensions, so distutils hands the CUDA source
        # straight to cl.exe with no flags:
        #
        #   cl.exe /c /nologo /O2 ... /Tpcsrc\cuda\scatter_cuda.cu /Fo...obj
        #
        # MSVC parsing CUDA as C++ gives
        #   atomics.cuh(140): error C3861: 'atomicCAS': identifier not found
        #   scatter_cuda.cu(135): error C3409: empty attribute block
        # It killed torch_scatter / torch_cluster / torch_spline_conv on
        # Windows cu12.8 py3.10+3.11. torch_sparse, same family and same run,
        # PASSED under 84 -- it does not set use_ninja=False.
        #
        # Only those two pythons because torch 2.8.0 declares setuptools solely
        # for python>=3.12: 3.12/3.13 inherit 78.1.0 from the PyTorch index,
        # while 3.10/3.11 fail the >=78 floor against the toolcache's 65.5.0
        # and resolve from PyPI to the newest release. torch 2.11 declares it
        # unconditionally, which is the ONLY reason cu13.0 escaped -- it has
        # the identical broken monkeypatch and is one resolution away from the
        # same failure. This ceiling closes that too.
        #
        # 83.0.0 still calls self.spawn(args) and still carries the relative-I
        # fix the floor exists for, so the window is real, not a guess. Do not
        # raise this without re-checking that hook.
        uv pip install --system wheel 'setuptools>=78,<84' ninja numpy packaging pyyaml $EXTRA_DEPS
        # triton best-effort: some setup.pys import it at build time, but it
        # trails new pythons (no cp315 wheels while 3.15 is rc) -- a missing
        # triton must not kill every cell of a brand-new python line.
        uv pip install --system triton || echo "::notice::no triton for this python -- continuing without it"

    - name: Save uv cache (Linux)
      if: |
        inputs.platform == 'linux' && steps.uv-cache-linux.outputs.cache-hit != 'true' &&
        ((inputs.cuda-short == '124' && inputs.pytorch-version == '2.4.1') ||
         (inputs.cuda-short == '128' && inputs.pytorch-version == '2.8.0'))
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/uv
        key: uv-linux-cu${{ inputs.cuda-short }}-torch${{ inputs.pytorch-version }}

    # ============== WINDOWS ==============
    - name: Restore uv cache (Windows)
      if: inputs.platform == 'windows'
      id: uv-cache-windows
      uses: actions/cache/restore@v4
      with:
        path: ~\AppData\Local\uv\cache
        key: uv-windows-cu${{ inputs.cuda-short }}-torch${{ inputs.pytorch-version }}

    - name: Install dependencies (Windows)
      if: inputs.platform == 'windows'
      shell: bash
      # Same as the Linux step above -- this one is also `shell: bash` (Git Bash
      # on windows runners), so it has identical metacharacter semantics.
      env:
        EXTRA_DEPS: ${{ inputs.extra-deps }}
      run: |
        python -m pip install uv
        uv pip install --system --reinstall torch==${{ inputs.pytorch-version }}+cu${{ inputs.cuda-short }} --index-url https://download.pytorch.org/whl/cu${{ inputs.cuda-short }}
        # setuptools>=78: py3.10/3.11 toolcache Pythons ship 65.5.0 and uv leaves
        # an already-present version alone, so Windows cells silently built
        # against it -- 65.5.0 emits RELATIVE -I include dirs and nunchaku's
        # ninja compile then fails with C1083 (2026-08-24). Latent for every
        # Windows package, hence a farm-wide floor rather than extra_deps.
        #
        # <84 added 2026-08-27. setuptools 84.0.0 RENAMED the hook torch relies
        # on: _distutils/compilers/C/msvc.py's compile() now ends in
        # `self.call(args)` where every version through 83.0.0 ended in
        # `self.spawn(args)`. Verified by diffing the two wheels.
        #
        # torch's BuildExtension, on Windows with use_ninja=False, dispatches
        # .cu files to nvcc by monkeypatching self.compiler.spawn
        # (cpp_extension.py win_wrap_single_compile). Under 84 that assignment
        # still SUCCEEDS -- spawn survives as a deprecated shim -- and is then
        # never called. The patch has already nulled extra_postargs, and .cu is
        # already in _cpp_extensions, so distutils hands the CUDA source
        # straight to cl.exe with no flags:
        #
        #   cl.exe /c /nologo /O2 ... /Tpcsrc\cuda\scatter_cuda.cu /Fo...obj
        #
        # MSVC parsing CUDA as C++ gives
        #   atomics.cuh(140): error C3861: 'atomicCAS': identifier not found
        #   scatter_cuda.cu(135): error C3409: empty attribute block
        # It killed torch_scatter / torch_cluster / torch_spline_conv on
        # Windows cu12.8 py3.10+3.11. torch_sparse, same family and same run,
        # PASSED under 84 -- it does not set use_ninja=False.
        #
        # Only those two pythons because torch 2.8.0 declares setuptools solely
        # for python>=3.12: 3.12/3.13 inherit 78.1.0 from the PyTorch index,
        # while 3.10/3.11 fail the >=78 floor against the toolcache's 65.5.0
        # and resolve from PyPI to the newest release. torch 2.11 declares it
        # unconditionally, which is the ONLY reason cu13.0 escaped -- it has
        # the identical broken monkeypatch and is one resolution away from the
        # same failure. This ceiling closes that too.
        #
        # 83.0.0 still calls self.spawn(args) and still carries the relative-I
        # fix the floor exists for, so the window is real, not a guess. Do not
        # raise this without re-checking that hook.
        uv pip install --system wheel 'setuptools>=78,<84' ninja numpy packaging pyyaml $EXTRA_DEPS

    - name: Patch PyTorch header for Windows MSVC bug
      if: inputs.platform == 'windows'
      shell: bash
      run: |
        # Fix for https://github.com/pytorch/pytorch/issues/166123
        TORCH_PATH=$(python -c "import torch; print(torch.__path__[0])")
        HEADER_FILE="$TORCH_PATH/include/torch/csrc/dynamo/compiled_autograd.h"
        if [ -f "$HEADER_FILE" ]; then
          echo "Patching $HEADER_FILE for MSVC std:: ambiguity bug"
          sed -i 's/} else if constexpr (::std::is_same_v<T, ::std::string>) {/\/\/ PATCHED: } else if constexpr (::std::is_same_v<T, ::std::string>) {/' "$HEADER_FILE"
          sed -i 's/return at::StringType::get();/\/\/ PATCHED: return at::StringType::get();/' "$HEADER_FILE"
          echo "Patch applied successfully"
        else
          echo "Header file not found (may not be needed for this PyTorch version)"
        fi

    - name: Save uv cache (Windows)
      if: |
        inputs.platform == 'windows' && steps.uv-cache-windows.outputs.cache-hit != 'true' &&
        ((inputs.cuda-short == '124' && inputs.pytorch-version == '2.4.1') ||
         (inputs.cuda-short == '128' && inputs.pytorch-version == '2.8.0'))
      uses: actions/cache/save@v4
      with:
        path: ~\AppData\Local\uv\cache
        key: uv-windows-cu${{ inputs.cuda-short }}-torch${{ inputs.pytorch-version }}

    # Set combined output
    - name: Set cache-hit output
      id: uv-cache
      shell: bash
      run: |
        if [ "${{ inputs.platform }}" == "linux" ]; then
          echo "cache-hit=${{ steps.uv-cache-linux.outputs.cache-hit }}" >> $GITHUB_OUTPUT
        else
          echo "cache-hit=${{ steps.uv-cache-windows.outputs.cache-hit }}" >> $GITHUB_OUTPUT
        fi
